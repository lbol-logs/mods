FlandreSongBrokenDollMarch:
  Line1: 暗い部屋の中彼女は独り
  Line1A: In a dark room, she sits alone
  Line2: おもちゃに囲まれ　人形遊び
  Line2A: Surrounded by toys, she plays with dolls
  Line3: 服を着せ替えて
  Line3A: Changing their clothes
  Line4: 散らして 投げて
  Line4A: Scattering them, throwing them
  Line5: バラバラにして
  Line5A: Tearing them into pieces
  Line6: 中を見てみましょう
  Line6A: Let’s take a look inside
  Line7: この笑みの中に悪魔は宿る
  Line7A: Within that smile, a demon dwells
  Line8: 鼻歌のしらべに耳を澄ませ
  Line8A: Listen closely to her gentle humming
  Line9: ララ　ラララン　ラララン
  Line9A: La la lalala lalala
  Line10: 声がして
  Line10A: A voice calls out
  Line11: その後は悲鳴だけ響く
  Line11A: And then, only screams echo
  Line12: おままごと　しましょう
  Line12A: Let’s play house together
  Line13: 遊びのお相手は
  Line13A: Her playmate is
  Line14: 可愛らしいお人形
  Line14A: A lovely little doll
  Line15: 腕が千切れちゃった
  Line15A: Its arm has come off
  Line16: 部屋が汚れちゃう
  Line16A: The room's gotten messy
  Line17: 赤い綿散らして
  Line17A: Red stuffing scattered everywhere
  Line18: 糸で縫い直せば
  Line18A: If I sew it back with thread
  Line19: まだ遊べるかな？
  Line19A: Can we still play again?
  Line20: 継き接きのお人形
  Line20A: A patchwork doll
  Line21: 次は何しましょう
  Line21A: What shall we do next?
  Line22: 可愛い声で鳴く
  Line22A: It cries in a sweet little voice
  Line23: 私のおもちゃ
  Line23A: My precious toy
  Line24: とあるお屋敷の　そのまた奥に
  Line24A: Deep within a certain mansion
  Line25: 誰も知らない　秘密の花園
  Line25A: Lies a secret garden no one knows about
  Line26: 並ぶ人形は
  Line26A: The dolls lined up in rows
  Line27: 皆傷だらけ
  Line27A: Are all covered in wounds
  Line28: それを眺める
  Line28A: She gazes at them
  Line29: 恍惚の少女
  Line29A: A girl in ecstasy
  Line30: 入り込めば二度とは戻れない
  Line30A: Once you step inside, there's no return
  Line31: 茨に囲まれた 乙女の城
  Line31A: A maiden’s castle, surrounded by thorns
  Line32: ララ　ラララン　ラララン
  Line32A: La la lalala lalala
  Line33: 振り向けば
  Line33A: Turn around
  Line34: 無邪気さと狂気の笑みが浮かぶ
  Line34A: And a smile of innocence and madness appears
  Line35: ご挨拶しましょう
  Line35A: Let’s greet each other
  Line36: まずは握手かしら
  Line36A: Shall we start with a handshake?
  Line37: 新しいお人形
  Line37A: A brand-new doll
  Line38: 傷だらけになれば
  Line38A: If it gets all torn up
  Line39: 直してあげるわ
  Line39A: I’ll fix it for you
  Line40: 肌色のフェルトで
  Line40A: With skin-colored felt
  Line41: どうして何もかも　私が触れたら
  Line41A: Why is it that whenever I touch something
  Line42: 勝手に壊れちゃう
  Line42A: It breaks on its own?
  Line43: もっと頑丈な　玩具が欲しいのよ
  Line43A: I want a sturdier toy
  Line44: 探してきてね
  Line44A: Go find one for me
  Line45: おままごと　しましょう
  Line45A: Let’s play house together
  Line46: 遊びのお相手は
  Line46A: Her playmate is
  Line47: 可愛らしいお人形
  Line47A: A lovely little doll
  Line48: 頭が取れちゃった
  Line48A: Its head has come off
  Line49: お掃除しなくちゃ
  Line49A: I’ve got to clean up
  Line50: 真っ赤に染まる部屋
  Line50A: The room is dyed bright red
  Line51: 私悪くないわ
  Line51A: It’s not my fault
  Line52: すぐに壊れちゃう
  Line52A: They always break so easily
  Line53: 人形がいけないの！
  Line53A: It’s the doll’s fault!
  Line54: 怯える瞳が
  Line54A: Those trembling eyes
  Line55: 愛しく思えるの
  Line55A: Look so adorable
  Line56: 声を聞かせて
  Line56A: Let me hear your voice
