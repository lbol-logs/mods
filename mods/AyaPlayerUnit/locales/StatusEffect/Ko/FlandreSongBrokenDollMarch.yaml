FlandreSongBrokenDollMarch:
  Line1: 暗い部屋の中彼女は独り
  Line1A: 어두운 방 한가운데 소녀는 외로이
  Line2: おもちゃに囲まれ　人形遊び
  Line2A: 장난감에 둘려싸여 인형놀이를 하며
  Line3: 服を着せ替えて
  Line3A: 갈아입히거나
  Line4: 散らして 投げて
  Line4A: 흩트려 내던지고
  Line5: バラバラにして
  Line5A: 조각조각 해서
  Line6: 中を見てみましょう
  Line6A: 속을 드려내 봅시다
  Line7: この笑みの中に悪魔は宿る
  Line7A: 미소짓는 얼굴에 도사린 악마 있어
  Line8: 鼻歌のしらべに耳を澄ませ
  Line8A: 콧노래에 슬쩍 귀를 귀울이면
  Line9: ララ　ラララン　ラララン
  Line9A: 라라 랄랄라 랄랄라
  Line10: 声がして
  Line10A: 노래 부르다
  Line11: その後は悲鳴だけ響く
  Line11A: 그 이후로는 비명 뿐이네
  Line12: おままごと　しましょう
  Line12A: 소꿉놀이라도 할까요?
  Line13: 遊びのお相手は
  Line13A: 놀이 상대는
  Line14: 可愛らしいお人形
  Line14A: 사랑스러운 인형
  Line15: 腕が千切れちゃった
  Line15A: 팔이 떨어져버렸네
  Line16: 部屋が汚れちゃう
  Line16A: 방을 더렵히는
  Line17: 赤い綿散らして
  Line17A: 새빨간 솜털
  Line18: 糸で縫い直せば
  Line18A: 실로 꽤매면
  Line19: まだ遊べるかな？
  Line19A: 다시 놀 수 있을까나?
  Line20: 継き接きのお人形
  Line20A: 이어붙인 누더기 인형
  Line21: 次は何しましょう
  Line21A: 다음은 뭘 해볼까요?
  Line22: 可愛い声で鳴く
  Line22A: 귀여운 목소리로 우는
  Line23: 私のおもちゃ
  Line23A: 나의 장난감
  Line24: とあるお屋敷の　そのまた奥に
  Line24A: 어느 저택의 깊숙한 너머에는
  Line25: 誰も知らない　秘密の花園
  Line25A: 아무도 모르는 비밀의 화원
  Line26: 並ぶ人形は
  Line26A: 줄 서있는 인형은
  Line27: 皆傷だらけ
  Line27A: 모두 상처투성이
  Line28: それを眺める
  Line28A: 그걸 바라보며
  Line29: 恍惚の少女
  Line29A: 황홀해보이는 소녀
  Line30: 入り込めば二度とは戻れない
  Line30A: 길을 잃으면 다시는 돌아가지 못해
  Line31: 茨に囲まれた 乙女の城
  Line31A: 가시덤불 우겨진 소녀의 성에
  Line32: ララ　ラララン　ラララン
  Line32A: 라라 랄랄라 랄랄라
  Line33: 振り向けば
  Line33A: 뒤돌아보면
  Line34: 無邪気さと狂気の笑みが浮かぶ
  Line34A: 천진난만한 광기의 미소가 떠올라
  Line35: ご挨拶しましょう
  Line35A: 처음 뵙겠습니다
  Line36: まずは握手かしら
  Line36A: 먼저 악수라도 할까요?
  Line37: 新しいお人形
  Line37A: 새로운 인형씨
  Line38: 傷だらけになれば
  Line38A: 상처가 나버린다면
  Line39: 直してあげるわ
  Line39A: 다시 고쳐줄게
  Line40: 肌色のフェルトで
  Line40A: 살색의 펠트지로
  Line41: どうして何もかも　私が触れたら
  Line41A: 어째서 내가 손대는 것들 마다
  Line42: 勝手に壊れちゃう
  Line42A: 멋대로 망가지는 거야?
  Line43: もっと頑丈な　玩具が欲しいのよ
  Line43A: 좀 더 튼튼한 인형을 가지고 싶어
  Line44: 探してきてね
  Line44A: 찾아와줬으면 해
  Line45: おままごと　しましょう
  Line45A: 소꿉놀이라도 할까요?
  Line46: 遊びのお相手は
  Line46A: 놀이 상대는
  Line47: 可愛らしいお人形
  Line47A: 사랑스러운 인형
  Line48: 頭が取れちゃった
  Line48A: 머리가 빠져버렸네
  Line49: お掃除しなくちゃ
  Line49A: 청소하지 않으면
  Line50: 真っ赤に染まる部屋
  Line50A: 점점 붉게 물드는 방
  Line51: 私悪くないわ
  Line51A: 난 나쁘지 않은걸
  Line52: すぐに壊れちゃう
  Line52A: 금방 부서져버리는
  Line53: 人形がいけないの！
  Line53A: 당신(인형)이 나쁜거야!
  Line54: 怯える瞳が
  Line54A: 떨려오는 눈동자가
  Line55: 愛しく思えるの
  Line55A: 사랑스럽게 느껴져
  Line56: 声を聞かせて
  Line56A: 목소릴 들려줘
