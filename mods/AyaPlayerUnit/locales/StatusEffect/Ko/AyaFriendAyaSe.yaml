AyaFriendAyaSe:
  Brief: >-
    {PlayerName}는 |방어|와 |보호막|을 얻을 수 없습니다.

    {PlayerName}는 모든 피해와 상태이상에 면역입니다.

    사용하지 않은 마나가 턴 종료시 사라지지 않습니다.

    손패의 상한량이 {MaxHand}장으로 늘어납니다.

    {PlayerName}가 카드를 사용할 때, 카드를 한장 뽑고 {Mana}와 |가속| {Value}을 얻습니다.

    |가속|이 공격피해를 증가시킵니다.
