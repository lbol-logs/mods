AyaFriendAyaSe:
  Brief: >-
    {PlayerName}は|ブロック|と|バリア|を得られない。

    {PlayerName}は全てのダメージと全てのデバフを無効化する。

    ターン終了時にマナを失わない。

    手札の上限が{MaxHand}枚になる。

    {PlayerName}がカードを使用するたび、山札の一番上のカードを手札に移動させ、{Mana}と|加速|{Value}を得る。

    |加速|は攻撃ダメージを上昇させる。
