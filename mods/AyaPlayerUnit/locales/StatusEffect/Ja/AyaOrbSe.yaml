AyaOrbSe:
  Brief: >-
    {OwnerName} のターン開始時、|ブロック|をすべてではなく半分だけ失う。

    {OwnerName} が受けるダメージが軽減される。

    山札をシャッフルするたびに、{Value1}の|創造者の遺産|を得る。

    {OwnerName}のターン終了時、{Value2}の|創造者の遺産|を失う。
  Description: >-
    {OwnerName} のターン開始時、|ブロック|をすべてではなく半分だけ失う。

    {OwnerName} が受けるダメージが{Level}%軽減される。

    山札をシャッフルするたびに、{Value1}の|創造者の遺産|を得る。

    {OwnerName}のターン終了時、{Value2}の|創造者の遺産|を失う。
  Name: 創造者の遺産
