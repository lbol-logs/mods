FlandreSongBrokenDollMarch:
  Line1: 暗い部屋の中彼女は独り
  Line1A: ''
  Line2: おもちゃに囲まれ　人形遊び
  Line2A: ''
  Line3: 服を着せ替えて
  Line3A: ''
  Line4: 散らして 投げて
  Line4A: ''
  Line5: バラバラにして
  Line5A: ''
  Line6: 中を見てみましょう
  Line6A: ''
  Line7: この笑みの中に悪魔は宿る
  Line7A: ''
  Line8: 鼻歌のしらべに耳を澄ませ
  Line8A: ''
  Line9: ララ　ラララン　ラララン
  Line9A: ''
  Line10: 声がして
  Line10A: ''
  Line11: その後は悲鳴だけ響く
  Line11A: ''
  Line12: おままごと　しましょう
  Line12A: ''
  Line13: 遊びのお相手は
  Line13A: ''
  Line14: 可愛らしいお人形
  Line14A: ''
  Line15: 腕が千切れちゃった
  Line15A: ''
  Line16: 部屋が汚れちゃう
  Line16A: ''
  Line17: 赤い綿散らして
  Line17A: ''
  Line18: 糸で縫い直せば
  Line18A: ''
  Line19: まだ遊べるかな？
  Line19A: ''
  Line20: 継き接きのお人形
  Line20A: ''
  Line21: 次は何しましょう
  Line21A: ''
  Line22: 可愛い声で鳴く
  Line22A: ''
  Line23: 私のおもちゃ
  Line23A: ''
  Line24: とあるお屋敷の　そのまた奥に
  Line24A: ''
  Line25: 誰も知らない　秘密の花園
  Line25A: ''
  Line26: 並ぶ人形は
  Line26A: ''
  Line27: 皆傷だらけ
  Line27A: ''
  Line28: それを眺める
  Line28A: ''
  Line29: 恍惚の少女
  Line29A: ''
  Line30: 入り込めば二度とは戻れない
  Line30A: ''
  Line31: 茨に囲まれた 乙女の城
  Line31A: ''
  Line32: ララ　ラララン　ラララン
  Line32A: ''
  Line33: 振り向けば
  Line33A: ''
  Line34: 無邪気さと狂気の笑みが浮かぶ
  Line34A: ''
  Line35: ご挨拶しましょう
  Line35A: ''
  Line36: まずは握手かしら
  Line36A: ''
  Line37: 新しいお人形
  Line37A: ''
  Line38: 傷だらけになれば
  Line38A: ''
  Line39: 直してあげるわ
  Line39A: ''
  Line40: 肌色のフェルトで
  Line40A: ''
  Line41: どうして何もかも　私が触れたら
  Line41A: ''
  Line42: 勝手に壊れちゃう
  Line42A: ''
  Line43: もっと頑丈な　玩具が欲しいのよ
  Line43A: ''
  Line44: 探してきてね
  Line44A: ''
  Line45: おままごと　しましょう
  Line45A: ''
  Line46: 遊びのお相手は
  Line46A: ''
  Line47: 可愛らしいお人形
  Line47A: ''
  Line48: 頭が取れちゃった
  Line48A: ''
  Line49: お掃除しなくちゃ
  Line49A: ''
  Line50: 真っ赤に染まる部屋
  Line50A: ''
  Line51: 私悪くないわ
  Line51A: ''
  Line52: すぐに壊れちゃう
  Line52A: ''
  Line53: 人形がいけないの！
  Line53A: ''
  Line54: 怯える瞳が
  Line54A: ''
  Line55: 愛しく思えるの
  Line55A: ''
  Line56: 声を聞かせて
  Line56A: ''
