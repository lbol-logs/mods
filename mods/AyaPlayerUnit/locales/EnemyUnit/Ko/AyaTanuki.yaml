  AyaTanukiOutro3Aya: 미안. 그냥 네가 하는 행동이 귀여워서.
  AyaTanukiOutro4AyaTanuki: ㄱ...귀엽다고요?
  AyaTanukiOutro5Aya: 애초에 왜 여기 있어? 마미조씨의 부하 아냐?
  AyaTanukiOutro6AyaTanuki: 전 아직 배울게 많아요. 그래서 대장님이 저한테는 일을 안시켜요..
  AyaTanukiOutro7AyaTanuki: 죽림에서 변장 기술을 연습하던 중 아야씨의 탄막이 날아가는걸 봤어요.
  AyaTanukiOutro8Aya: 의심스럽지만, 마미조씨가 이 사건에 초보 너구리를 보낼일은 없겠지.
  AyaTanukiOutro9AyaTanuki: 아야씨를 놀래켜주고 싶었을 뿐인데, 입을 열자마자 공격하셔서..
  AyaTanukiOutro10Aya: 어, 음.. 미안해.?
  AyaTanukiOutro11AyaTanuki: 사과하고 싶으시면 저도 따라갈래요.
  AyaTanukiOutro12Aya: 뭐? 내가 왜...
  AyaTanukiOutro13Aya: 그래, 그래. 뒤쳐지지나 마.
  AyaTanukiOutro14AyaTanuki: 야호~! 아야씨에게 많이 배울거야!
