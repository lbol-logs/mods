  AyaTanukiOutro9AyaTanuki: ちょっと文さんを驚かせたかっただけなのに、口を開いた瞬間に攻撃されたの…
  AyaTanukiOutro10Aya: えっ、ああ、それは…ごめんね。
  AyaTanukiOutro11AyaTanuki: 謝るなら、私を連れて行って！
  AyaTanukiOutro12Aya: えっ？なんで私が…
  AyaTanukiOutro13Aya: わかったわかった、でも遅れないでよね。
  AyaTanukiOutro14AyaTanuki: やった〜！文さんから学ぶことがいっぱいあるんだから！
