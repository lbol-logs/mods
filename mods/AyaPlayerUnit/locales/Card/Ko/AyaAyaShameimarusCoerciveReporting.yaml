    |암흑노가쿠|: {PlayerName}의 모든 디버프를 제거하고 |부적|을 {Value5} 얻습니다. 남은 전투동안 |암흑노가쿠|를 무효합니다.

    |방해|: 카드가 |방해|당할 때 마다, 모든 적에게 피해를 {Value6} 줍니다.
