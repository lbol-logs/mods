FlandreOnePair:
  Description: >-
    손에 있는 |액운| 또는 상태 카드가 아닌 카드를 1장 선택합니다.

    카드를 선택했다면, 같은 종류의 무작위 카드 {Value1}장 중 1장을 선택해 손에 넣습니다.

    그 카드는 |일시적으로| {Mana}의 비용을 가지며, |소멸| 및 |휘발성|입니다.
