AyaFriendHatate:
  Description: '{FriendP}|f:염사|: |영력|을 {Value1} 얻습니다. |화과자념보|를 {Value2}장 뽑을 카드 더미에 추가합니다.'
  ExtraDescription1: '{FriendP2}|f:경쟁자|: |화과자념보|가 추가될 때 마다, 대신 |특별 화과자념보|를 추가합니다.'
  ExtraDescription3: '{FriendU3}|u:원안「텐구 사이코그래피」|: 체력이 가장 적은 적에게 피해를 {Damage} 줍니다. |퇴치|: 대상이 유명한 존재라면, |영구적으로| 추가스킬을 얻습니다. |명중|'
  Name: 하타테, 요즘 시대의 염사 기자
  DetailText: '|염사 - Empty|: 효과 없음.'
  DetailTextKanako: '|염사 - 카나코|: 전투 시작시, 최대체력을 {Value4} 얻습니다.'
  DetailTextSuwako: '|염사 - 스와코|: 전투 시작시, <sprite="Point" name="Power">를 {Value7} 얻습니다.'
  DetailTextSunny: '|염사 - 써니|: 전투 시작시, |화력|을 {Value4} 얻습니다.'
  DetailTextLuna: '|염사 - 루나|: 전투 시작시, |영력|을 {Value4} 얻습니다.'
  DetailTextStar: '|염사 - 스타|: 전투 시작시, 모든 적에게 |록 온|을 {Value5} 줍니다.'
  DetailTextAya: '|염사 - 아야|: 효과 없음.'
  DetailTextRin: '|염사 - 린|: 적이 |소환|될 때, |화력|을 {Value4} 얻습니다.'
  DetailTextNitori: '<sprite="Ultimate" name="0">|u:염사 - 니토리|: 덱에 무작위 |도구|카드를 추가합니다.'
  DetailTextYoumu: '<sprite="Active" name="-3">|a:염사 - 요우무|: 체력이 가장 적은 적에게 피해를 {Damage2Value}씩 {Value6}번 줍니다. |명중|'
  DetailTextKokoro: '<sprite="Passive" name="0">|f:염사 - 코코로|: 적이 부정적 효과를 얻을 때, |일시 화력|을 {Value4} 얻습니다.'
  DetailTextClownpiece: '<sprite="Active" name="0">|a:염사 - 클라운피스|: {Mana}를 얻습니다. 모든 적이 |화력|을 {Value3} 얻습니다.'
  DetailTextSiji: '<sprite="Active" name="-3">|a:염사 - 시키에이키|: 모든 적에게 피해를 {Damage3Value} 줍니다. |명중|'
  DetailTextDoremy: '<sprite="Active" name="-3">|a:염사 - 도레미|: 손의 카드를 한 장 고릅니다. 그 카드의 |복사본|을 한 장 얻습니다.'
  DetailTextReimu: '<sprite="Active" name="0">|a:염사 - 레이무|: 전투 종료시 까지 모든 카드를 |강화|합니다.'
  DetailTextMarisa: '<sprite="Passive" name="0">|f:염사 - 마리사|: 공격/상태 카드를 사용할 때, |충전|을 {Value3} 얻습니다.'
  DetailTextSakuya: '<sprite="Ultimate" name="-3">|u:염사 - 사쿠야|: |추가 턴|을 {Value3} 얻습니다.'
  DetailTextCirno: '<sprite="Passive" name="0">|f:염사 - 치르노|: 손의 모든 |동료|카드가 |지원력|을 {Value4} 얻습니다.'
  DetailTextKoishi: '<sprite="Passive" name="0">|f:염사 - 코이시|: 뽑을 카드 더미 맨 위의 카드를 사용합니다.'
  DetailTextLong: '<sprite="Passive" name="0">|f:염사 - 메구무|: |붕붕마루 신문|이 피해를 두배로 줍니다. 이 효과는 중첩되지 않습니다.'
  DetailTextTianzi: '<sprite="Ultimate" name="-3">|u:염사 - 텐시|: |천위무봉|을 {Value3} 얻습니다.'
  DetailTextYuyuko: '<sprite="Active" name="-3">|a:염사 - 유유코|: 체력이 가장 적은 적에게 피해를 {Damage3Value} 줍니다. 적이 유명한 존재가 아니라면, 즉사시킵니다. |명중|'
  DetailTextSanae: '<sprite="Active" name="-3">|a:염사 - 사나에|: {PlayerName}의 모든 부정적인 효과를 제거하고 |부적|을 {Value4} 얻습니다.'
  DetailTextRemilia: '<sprite="Ultimate" name="-6">|u:염사 - 레밀리아|: 체력이 가장 적은 적에게 피해를 {Damage3Value} 줍니다. 막히지 않은 피해만큼 체력을 얻습니다. |명중|'
  DetailTextJunko: '<sprite="Ultimate" name="-3">|u:염사 - 순호|: 전투 종료시 까지 모든 카드가 |정화|됩니다.'
  DetailTextSeija: '|염사 - 세이자|: {PlayerName}는 한 턴에 최대 체력의 {Value8}% 이상의 피해를 받지 않습니다.'
  DetailTextYiji: '|염사 - 요리히메|: 효과 없음.'
  DetailTextUnknown: '|염사 - Unknown|: 전투 시작시, |화력|과 |영력|을 {Value3} 얻습니다.'
