FlandreFaustianBargain:
  Description: >-
    손, 뽑을 카드 더미, 버린 더미에서 각각 1장씩 |소멸|시킵니다.

    이렇게 |소멸|된 카드가 있다면, |소멸| 영역에서 카드 1장을 선택해 손에 되돌립니다.

    |소멸 시|: |소멸| 영역에서 카드 1장을 선택해 손에 되돌립니다.
  UpgradedDescription: >-
    손패, 뽑을 카드 더미, 버린 더미에서 최대 {Value1}장씩 |소멸|시킵니다.

    이렇게 |소멸|된 카드가 있다면, |소멸| 영역에서 최대 {Value1}장까지 선택해 손에 되돌립니다.

    |소멸 시|: |소멸| 영역에서 최대 {Value1}장까지 선택해 손에 되돌립니다.
  PhantasmModeDescription: >-
    손, 뽑을 카드 더미, 버린 카드 더미에서 카드를 한 장 |소멸|시킵니다.

    이렇게 |소멸|된 카드가 있다면, 체력을 {Value2} 잃고 |소멸| 영역에서 카드를 한 장 선택해 손으로 되돌립니다.

    |소멸|될 시: |소멸| 영역에서 카드를 한 장 선택해 손으로 되돌립니다.
  PhantasmModeUpgradedDescription: >-
    손, 뽑을 카드 더미, 버린 카드 더미에서 최대 {Value1}장의 카드를 |소멸|시킵니다.

    이렇게 |소멸|된 카드가 있다면, 체력을 {Value2} 잃고 |소멸| 영역에서 최대 {Value1}장의 카드를 선택해 손으로 되돌립니다.

    |소멸|될 시: |소멸| 영역에서 최대 {Value1}장의 카드를 선택해 손으로 되돌립니다.
  Name: 파우스트의 거래
