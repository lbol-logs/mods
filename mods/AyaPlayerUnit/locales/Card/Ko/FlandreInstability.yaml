  InstabilityBuff2: '|{Buff1}|을 {BuffValue1}, |{Buff2}|을 {BuffValue2} 얻습니다.'
  InstabilityDebuff1: '|{Debuff}|을 {DebuffValue} 줍니다.'
  InstabilityDebuff2: 모든 적에게 |{Debuff}|을 {DebuffValue} 줍니다.
  Name: 정신분열
  DetailText: '{SelfName}은 전투 중 무작위로 생성되지 않으며, 복사할 수 없습니다.'
