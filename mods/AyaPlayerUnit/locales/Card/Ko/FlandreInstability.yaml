  InstabilityDiscard2: 손에 든 모든 카드를 버립니다.
  InstabilityExile1: 손, 뽑을 카드 더미, 버린 카드 더미에서 최대 {ExileValue}장을 |소멸|시킵니다.
  InstabilityExile2: 손에 든 모든 카드를 |소멸|시킵니다.
  InstabilityMove1: 뽑을 카드 더미에서 카드 최대 {MoveValue}장을 선택해 손에 넣습니다.
  InstabilityMove2: 버린 카드 더미에서 카드 최대 {MoveValue}장을 선택해 손에 넣습니다.
