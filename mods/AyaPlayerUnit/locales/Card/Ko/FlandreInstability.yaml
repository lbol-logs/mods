  InstabilityAdd2: 무작위 카드 {AddValue1}장을 손에 넣습니다. {AddValue1:plural one='그 카드는' other='그 카드들은'} |일시적으로| {AddManaValue}의 비용을 가지며, |소멸| 및 |휘발성|입니다.
  InstabilityAdd3: 무작위 카드 {AddValue2}장 중 {AddValue1}장을 선택해 손에 넣습니다. {AddValue1:plural one='그 카드는' other='그 카드들은'} |일시적으로| {AddManaValue}의 비용을 가지며, |소멸| 및 |휘발성|입니다.
