  AyaShameimarusCoerciveReportingEscape31Aya: 你好，你好！
  AyaShameimarusCoerciveReportingEscape32Aya: 现在，我
  AyaShameimarusCoerciveReportingEscape33Aya: 就在你身后！
  AyaShameimarusCoerciveReportingDetonate1Aya: 你有爆炸物许可证吗？
  AyaShameimarusCoerciveReportingDetonate2Rin: 什么是爆炸物许可证？
