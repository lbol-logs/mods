FlandreBitestheDust:
  Description: >-
    Gain {FlandreShield} |Barrier|.

    Gain {FlandreValue1} |Static Charge|.

    Gain {Value2} |Madness|.

    If {PlayerName}'s life is {Value3}% or less during non-boss combat, restart the current level. ({Amount})

    Then, at the start of {PlayerName}'s first turn, |Destroy| all enemies, gain {Value4} |Madness|, and remove {SelfName} from combat and the library.
