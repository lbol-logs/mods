  DetailTextRemilia: '<sprite="Ultimate" name="-6">|u:念写 - レミリア|: ライフが一番少ない敵に{Damage3Value}ダメージを与える。敵がブロックできなかったダメージに等しいライフを得る。|精密|'
  DetailTextJunko: '<sprite="Ultimate" name="-3">|u:念写 - 純狐|: 戦闘終了まですべてのカードは|純化|を得る。'
  DetailTextSeija: '|念写 - 正邪|: {PlayerName}は各ターン最大体力の{Value8}%以上のライフを失わない。'
  DetailTextYiji: '|念写 - 依姫|: 効果なし。'
  DetailTextUnknown: '|念写 - Unknown|: 戦闘開始時、|火力|{Value3}と|霊力|{Value3}を得る。'
