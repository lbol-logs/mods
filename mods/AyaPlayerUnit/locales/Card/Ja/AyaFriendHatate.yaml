  DetailTextMarisa: '<sprite="Passive" name="0">|f:念写 - 魔理沙|: プレイヤーが攻撃カードか状態異常をプレイする度に、|チャージ|{Value3} を得る。'
  DetailTextSakuya: '<sprite="Ultimate" name="-3">|u:念写 - 咲夜|: |追加ターン|{Value3}を得る。'
  DetailTextCirno: '<sprite="Passive" name="0">|f:念写 - チルノ|: 手札の|パートナー|１枚ごとに |支援度|{Value4}を得る。'
  DetailTextKoishi: '<sprite="Passive" name="0">|f:念写 - こいし|: 山札の一番上のカードをプレイする。'
  DetailTextLong: '<sprite="Passive" name="0">|f:念写 - 龍|: |文々。新聞|のダメージを２倍にする。この効果は重複しない。'
  DetailTextTianzi: '<sprite="Ultimate" name="-3">|u:念写 - 天子|: |天衣無縫|{Value3}を得る。'
