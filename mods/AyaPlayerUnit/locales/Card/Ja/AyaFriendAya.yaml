  ExtraDescription4: '{FriendU}|d:「無双風神」: この効果は戦闘中に1回のみ使用できる。全ての敵に{Value2}回、{Damage}の攻撃ダメージを与える。敵はこのターン行動できない。これらの効果は{PlayerName}の次のターンの開始時にも繰り返される。精密|'
