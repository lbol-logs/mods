  AyaShameimarusCoerciveReportingEscape2Aya: 本気で私から逃げられると思います？
  AyaShameimarusCoerciveReportingEscape31Aya: こんにちは！
  AyaShameimarusCoerciveReportingEscape32Aya: 私は今、
  AyaShameimarusCoerciveReportingEscape33Aya: あなたの後ろにいます！
  AyaShameimarusCoerciveReportingDetonate1Aya: 危険物取扱者資格はお持ちで？
