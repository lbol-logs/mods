  FlandreTutorialStage1Name: ステージ1 - 青
  FlandreTutorialStage1Intro1SukusukuAya: >-
    すく。

    （説明を始める前に、まずあなたが何者なのか紹介しましょう。）
  FlandreTutorialStage1Intro2SukusukuAya: >-
    すく。

    （あなたは{0}です。あなたは吸血鬼ですが、吸血鬼・悪魔・魔法少女という複数の側面を持っています。）
  FlandreTutorialStage1Intro3SukusukuAya: >-
    すく。

    （少なくとも495歳以上です。紅魔館の主であるレミリア・スカーレットの妹です。）
  FlandreTutorialStage1Intro4SukusukuAya: >-
    すく。

    （あなたはレミリアによって495年間地下室に閉じ込められていました。でも、本気を出せば脱出することもできました。）
  FlandreTutorialStage1Intro5Flandre: それって引きこもりって言いたいの？
  FlandreTutorialStage1Intro6SukusukuAya: >-
    すく。

    （なぜなら、あなたにはあらゆるものを破壊する能力があるからです。）
  FlandreTutorialStage1Intro7Flandre: ふふん。すべてのものには目があって、私はすべての目を手の中に握っているの。
  FlandreTutorialStage1Intro8Flandre: その目を握りつぶすと……ドカーン！
  FlandreTutorialStage1Intro9SukusukuAya: >-
    すく！

    （そして、それこそが最初に学ぶことです！）
  FlandreTutorialStage1Intro10SukusukuAya: >-
    すく。

    （{0}の青マナは、あらゆるものを破壊する能力を表しています。主なキーワードは|破滅|と|破壊|です。）
  FlandreTutorialStage1Intro11SukusukuAya: >-
    すく。

    （|破滅|は、敵が受けるダメージを増加させます。たとえ本来なら0ダメージになる攻撃でも影響します。そのため{0}はどんな状況でもダメージを与えられます。）
  FlandreTutorialStage1Intro12SukusukuAya: >-
    すく。

    （|破壊|は単純です。条件を満たすと、{0}は対象を即座に倒します。）
  FlandreTutorialStage1Intro13SukusukuAya: >-
    すく。

    （あなたの青カードには、カード操作や防御面を強化する効果もあります。）
  FlandreTutorialStage1Intro14SukusukuAya: >-
    すく！

    （チュートリアル戦闘を手伝ってくれる仲間を紹介します！）
  FlandreTutorialStage1Intro15SukusukuAya: >-
    すく！

    （来て、椛！）
  FlandreTutorialStage1Intro16SukusukuMomiji: >-
    すく……

    （もう、文。山の見回りで忙しかったのに……）
  FlandreTutorialStage1Intro17SukusukuAya: >-
    すく。

    （嘘ですね。寝ていました。）
  FlandreTutorialStage1Intro18SukusukuAya: >-
    すく！

    （さあ、文句を言うのはやめて授業を手伝ってください！）
  FlandreTutorialStage1Intro19SukusukuMomiji: >-
    すく？

    （でも本当の先生がいるよね？どうしてその人じゃなくて文が教えてるの？）
  FlandreTutorialStage1Intro20SukusukuAya: >-
    すく。

    （輝夜と妹紅の決闘に巻き込まれて入院中です。）
  FlandreTutorialStage1Intro21SukusukuMomiji: >-
    すく。

    （ああ……）
  FlandreTutorialStage1Intro22Flandre: それは面白いね。
  FlandreTutorialStage1Intro23SukusukuAya: >-
    すく！

    （とにかく椛！盾を使って{0}の攻撃を受けてください！）
  FlandreTutorialStage1Intro24SukusukuMomiji: >-
    すく！

    （分かった！）
  FlandreTutorialStage1Intro25SukusukuMomiji: >-
    ……すく？

    （……今なんて言ったか分かってる？）
  FlandreTutorialStage1Intro26SukusukuAya: >-
    すく。

    （{0}の攻撃を受けてください。）
  FlandreTutorialStage1Intro27SukusukuMomiji: >-
    すく！

    （それって、ナイフ一本で核ミサイルを止めろって言ってるようなものだよ！）
  FlandreTutorialStage1Intro28SukusukuAya: >-
    すく？

    （安心してください。{0}は手加減してくれますよね？{0}？）
  FlandreTutorialStage1Intro29Flandre: 生命保険には入っておいた方がいいよ！
  FlandreTutorialStage1Intro30SukusukuMomiji: >-
    すく！！！

    （すくすく白狼天狗に生命保険なんてないよ！！！）
  FlandreTutorialStage1Intro31SukusukuAya: >-
    すく！

    （椛の犠牲は忘れません！）
  FlandreTutorialStage1Intro32Flandre: いや、冗談だよ。力の0％しか使わないから。
  FlandreTutorialStage1Intro33SukusukuMomiji: >-
    すく？

    （それ全然安心できない……0％？）
  FlandreTutorialStage1BattleWave11Flandre: 私の攻撃は全部0ダメージになるけど、そこで|破滅|が役に立つんだ！
  FlandreTutorialStage1BattleWave12SukusukuAya: >-
    すく！

    （1ターンで{0}のHPを50％以下にしましょう！）
  FlandreTutorialStage1BattleWave21SukusukuMomiji: >-
    すく……

    （肋骨が1本か2本折れた気がする……）
  FlandreTutorialStage1BattleWave22SukusukuAya: >-
    すく。

    （攻撃を全部受け止めたのはあなたではなく、あなたの盾です。）
  FlandreTutorialStage1BattleWave23SukusukuAya: >-
    すく！

    （|破壊|を試してみましょう！）
  FlandreTutorialStage1BattleWave24SukusukuMomiji: >-
    ……すく？

    （……本気で言ってる？）
  FlandreTutorialStage1BattleWave25SukusukuAya: >-
    すく。

    （いえいえ、破壊されるのはあなたではありません。）
  FlandreTutorialStage1BattleWave26SukusukuAya: >-
    すく。

    （無駄な殺生を避けるため、標的用の人形を用意します。）
  FlandreTutorialStage1BattleWave27Flandre: まるで私が今まで無駄な殺人をしてきたみたいな言い方はやめてほしいな。
  FlandreTutorialStage1BattleWave28SukusukuMomiji: >-
    すく？

    （じゃあ、あれは何だったの？）
  FlandreTutorialStage1BattleWave29Flandre: 自然淘汰。
  FlandreTutorialStage1BattleWave210SukusukuMomiji: >-
    すく。

    （聞かなければよかった。）
  FlandreTutorialStage1BattleWave211Flandre: 冗談だけどね。
  FlandreTutorialStage1BattleWave212Flandre: 東方Projectのああいうダークな設定は、ZUNさんが中二病だった頃に作られたものなんだよ。
  FlandreTutorialStage1BattleWave213Flandre: 今ではホラー系二次創作を作るための便利な素材になってるだけ。
  FlandreTutorialStage1BattleWave214Flandre: 例えば、私が他の東方キャラと遊んでいる二次創作はたくさんあるよ。最後にはみんな酷い目に遭うけど。
  FlandreTutorialStage1BattleWave215SukusukuMomiji: >-
    すく。

    （例を出さなくてもよかったよね。）
  FlandreTutorialStage1BattleWave216SukusukuMomiji: >-
    すく。

    （それと、第四の壁を壊すのはやめてくれる？そういうのはするものじゃないよ。）
  FlandreTutorialStage1BattleWave217Flandre: でも私は公式設定でも第四の壁を破壊するキャラだから。
  FlandreTutorialStage1BattleWave218SukusukuMomiji: >-
    ……

    （……）
  FlandreTutorialStage1BattleWave219SukusukuAya: >-
    すく。

    （この標的人形のHPは9999です。）
  FlandreTutorialStage1BattleWave220Flandre: え、これ何でできてるの？
  FlandreTutorialStage1BattleWave221SukusukuAya: >-
    すく。

    （干し草の束です。）
  FlandreTutorialStage1BattleWave222Flandre: えっ……
  FlandreTutorialStage1BattleWave223SukusukuAya: >-
    すく！

    （そんな大ダメージを狙うより、|破壊|しましょう！）
  FlandreTutorialStage1BattleWave224SukusukuAya: >-
    すく！

    （1ターンで標的人形を倒しましょう！）
  FlandreTutorialStage1BattleWave31SukusukuAya: >-
    すく。

    （今のは本当に恐ろしい能力ですね。）
  FlandreTutorialStage1BattleWave32SukusukuAya: >-
    すく。

    （最後の戦闘には、あなたにぴったりの相手を用意しました。）
  FlandreTutorialStage1BattleWave33SukusukuAya: >-
    すく！

    （兎です！）
  FlandreTutorialStage1BattleWave34FraudRabbit: あたなは2MRC(守矢コイン)を受け取りました。取引を確認するにはリンクをクリックしてください：https://store.steampowered.com/app/1140150/Touhou_Lost_Branch_of_Legend/
  FlandreTutorialStage1BattleWave35SukusukuMomiji: >-
    すく！

    （詐欺師だ！）
  FlandreTutorialStage1BattleWave36Flandre: 働かずにお金を稼ごうとする人は嫌い。
  FlandreTutorialStage1BattleWave37SukusukuMomiji: >-
    すく。

    （あなたは働かなくてもいいからね。）
  FlandreTutorialStage1BattleWave38HardworkingRabbit: 地上人発見！戦闘開始！
  FlandreTutorialStage1BattleWave39LazyRabbit: えっと……3分もあれば、この地上人を倒すには十分ね。
  FlandreTutorialStage1BattleWave310Flandre: 私、不幸を司る神じゃないのに、あの兎たちへのすごい恨みを感じるんだけど。
  FlandreTutorialStage1BattleWave311Flandre: よっぽど嫌われてるんだね。
  FlandreTutorialStage1BattleWave312SukusukuMomiji: >-
    すく。

    （何をしても1ダメージしか受けない敵は、いろんなゲームであまり良い印象を持たれてないよね。）
  FlandreTutorialStage1BattleWave313SukusukuAya: >-
    すく！

    （何でも破壊できるということを見せてあげましょう、{0}！）
  FlandreTutorialStage1BattleWave314SukusukuAya: >-
    すく！

    （3ターン以内にすべての敵を倒しましょう！）
  FlandreTutorialStage1Outro1SukusukuAya: >-
    すく。

    （まとめると、{0}の青カードは何があっても敵を破壊することに特化しています。）
  FlandreTutorialStage1Outro2SukusukuAya: >-
    すく！

    （椛が破壊されなくてよかったですね！）
  FlandreTutorialStage1Outro3SukusukuMomiji: >-
    すく。

    （相手が誰か分かっていたら、ここには来なかったよ……）
  FlandreTutorialStage1Outro4SukusukuAya: >-
    すく？

    （あやや、あなたが手伝ってくれなかったら誰に助けてもらえばいいんですか？）
  FlandreTutorialStage1Outro5SukusukuMomiji: >-
    すく。

    （はたて。）
  FlandreTutorialStage1Outro6SukusukuAya: >-
    すく。

    （それは無理ですね。）
  FlandreTutorialStage1Outro7SukusukuMomiji: >-
    すく。

    （そう言うと思った。）
