  FlandreExtraBoss1SukusukuAya: >-
    すく?

    (何か壊すものを探しているのか？)
  FlandreEiki1Eiki: ！
  FlandreEiki2Flandre: 違うよ。
  FlandreEiki3Flandre: まず、私は盗みに来たんじゃなくて、遊びに来たの。
  FlandreEiki4Flandre: それに、私の分身は全部私自身なの。たとえ誰かに召喚されたとしてもね。
  FlandreEiki5Eiki: ……これで終わりだと思わないことです。後であなたの館を訪ねます、{0}。
  FlandreEiki6Flandre: 探しに来ても、私は家にいないけどね～
  FlandreEiki7Flandre: それで……どうする？
  FlandreEikiYesDescription: ''
  FlandreEikiYesName: 戦闘を続ける
  FlandreEikiNoDescription: ''
  FlandreEikiNoName: 戦闘を終了する
  FlandreEikiYes1Flandre: もちろん戦うよ！
  FlandreEikiYes2Flandre: それが聞きたかった！
  FlandreEikiNo1Flandre: ここで時間を無駄にするのはやめよう。
  FlandreEikiNo2Flandre: えー？つまらないのに～
  FlandreTakaneAttack: 攻撃
  FlandreTakane1Takane: げっ、またあんた！？
  FlandreTakane2Takane: 店じまいだよ！帰った帰った！
  FlandreTakane3Takane: あんたに売るものなんて何もないよ！
  FlandreTakane4Flandre: ……
  FlandreTakane5Takane: ゴホン
  FlandreTakane6Takane: ……じゃなくて、いらっしゃい！
  FlandreTakane7Takane: もちろん冗談だよ！あはは！
  FlandreAnnoyingSunlight1Flandre: 日傘を持ってくればよかった。
  FlandreAnnoyingSunlight2Flandre: 暑すぎる！
  FlandreAnnoyingSunlight31Flandre: うーん、太陽を壊しちゃおうかな？
  FlandreAnnoyingSunlight32Okina: ダメ！
  FlandreAnnoyingSunlight33Yukari: 絶対にダメ！
  FlandreAnnoyingSunlight34Flandre: はいはい……
  FlandreSongFirstTime1Okina: ねえフランドール、ちょっと聞きたいことがあるんだけど。
  FlandreSongFirstTime2Flandre: 今戦闘中だから、あとでね。
  FlandreSongFirstTime3Okina: 歌える？
  FlandreSongFirstTime4Flandre: ……え？
  FlandreSongFirstTime5Okina: 試してみるといいわ。魔法少女は歌も上手じゃないとね。
  FlandreSongFirstTime6Okina: 魔法少女と歌はいつだって最高の組み合わせよ。みんな魔法少女の歌が大好きなの。
  FlandreSongFirstTime7Okina: そして、それは当然ながら人間から得られる信仰も増えるということね。
  FlandreSongFirstTime8Flandre: でも、私は今まで一度も歌ったことなんてないよ。歌なんて一曲も知らないし。
  FlandreSongFirstTime9Okina: そんなことは関係ないわ。自分の心に浮かんだものを、感情を隠さずに歌えばいいの。
  FlandreSongFirstTime10Okina: もしかしたら、本当は歌が得意なのに、自分で気付いていないだけかもしれないわよ。
  FlandreSongFirstTime11Flandre: でも、魔法少女って戦いながら歌うものじゃないと思うけど。
  FlandreSongFirstTimeSelect: 歌い始めますか？
  FlandreSongFirstTimeYes1Flandre: 分かった。でも、私がどれだけ下手に歌っても笑わないでよ。
  FlandreSongFirstTimeYes2Okina: もちろん。最初は誰だって下手なものよ……
  FlandreSongFirstTimeYes3Okina: ！？
  FlandreSongFirstTimeNo1Flandre: 私に歌わせようなんて思わないでね。
  FlandreSongFirstTimeNo2Okina: '*ため息* 分かったわ。'
  FlandreSongFirstTimeEnding1Okina: いやぁ、本当に貴重な経験だったわ。どうだった？
  FlandreSongFirstTimeEnding2Flandre: 喉が痛い。ずっと喋り続けることに慣れてないから。
  FlandreSongFirstTimeEnding3Okina: あえて批判点を挙げるなら、歌詞がかなり奇妙だったことかしら。
  FlandreSongFirstTimeEnding4Okina: でも、好きなように歌ってと言った私の責任ね。
  FlandreSongFirstTimeEnding5Okina: だから……素晴らしかったわ！最高だったと言ってもいいくらい！
  FlandreSongFirstTimeEnding6Flandre: 褒めても、もっと歌ったりはしないからね。
  FlandreSongFirstTimeEnding7Okina: 分かっているわ。それに、人間たちはあの演出を本当に気に入っていたわよ。
  FlandreSongFirstTimeEnding8Flandre: 人間？どうして？
  FlandreSongFirstTimeEnding9Okina: 私の扉を使って、あなたの歌を人間の里に放送していたのよ。
  FlandreSongFirstTimeEnding10Okina: 人間の里にはテレビなんてほとんどないけれど、私には関係ないわ。
  FlandreSongFirstTimeEnding11Flandre: あなたって神様なの？それともパパラッチ？
  FlandreSongFirstTimeEnding12Okina: 失礼ね。私はあなたのマネージャーとして仕事をしているだけよ。
  FlandreSongFirstTimeEnding13Okina: 人間たちは歌詞の意味はほとんど理解できなかったけれど、それでもあなたの歌と戦いには夢中になっていたわ。
  FlandreSongFirstTimeEnding14Flandre: 歌いながら誰かを倒すことの何がそんなに面白いのか、私にはよく分からないけどね。
  FlandreSongFirstTimeEnding15Okina: それで、あなたの歌についてだけど……
  FlandreSongFirstTimeEnding16Flandre: 嫌。
  FlandreSongFirstTimeEnding17Okina: お願い？
  FlandreSongFirstTimeEnding18Flandre: 嫌。
  FlandreSongFirstTimeEnding19Okina: 気が変わる日を、いつまでも待っているわ！
