    （{0}の黒マナは、悪魔としての側面を表しています。主なキーワードは|クリスタル|と|供物|です。）
  FlandreTutorialStage2Intro3SukusukuMomiji: >-
    すく。

    （クリスタルといえば、あなたのクリスタルの翼が気になっていたんだけど。）
  FlandreTutorialStage2Intro4Flandre: 私の翼？
  FlandreTutorialStage2Intro5SukusukuMomiji: >-
    すく？

    （幻想郷の基準で見ても、あなたの翼は前例がないものだよ。一体どうしてそんな翼になったの？）
  FlandreTutorialStage2Intro6Flandre: 昔はお姉様と同じ翼だったんだけど、何度も壊しては治しているうちに、クリスタルを翼として使うことにしたの。
  FlandreTutorialStage2Intro7Flandre: 修理するのもずっと簡単だし、弾幕にも使えるからね。
  FlandreTutorialStage2Intro8SukusukuMomiji: >-
    すく？

    （弾幕？）
