  FlandreMadnessDescription: >-
    {0}は最大で |狂気|{6}まで蓄積できます。

    {0}の攻撃は、|狂気|1つにつき|e:{1}|%ダメージが増加します。（最大|e:{2}|%）

    {0}がカードから得る|ブロック|と|バリア|は、|狂気|1つにつき|e:{3}|%減少します。（最大|e:{4}|%）

    {0}がレベルアップするたびに、{5} |狂気|を失います。

    |r:{0}が{6} |狂気|になると、ゲームに敗北します。|
