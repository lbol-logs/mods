  FlandreSongFirstTime1Okina: Hey Flandre, I'd like to ask you something.
  FlandreSongFirstTime2Flandre: I'm in a battle, later.
  FlandreSongFirstTime3Okina: Can you sing?
  FlandreSongFirstTime4Flandre: '...What?'
  FlandreSongFirstTime5Okina: You should try it. Magical Girls needs to be good at singing too.
  FlandreSongFirstTime6Okina: Magical Girls and songs are always a great combination. People love Magical Girl songs.
  FlandreSongFirstTime7Okina: And that means more faith I can get from humans, obviously.
  FlandreSongFirstTime8Flandre: But I have never sung a song in my entire life. I don't know a single song.
  FlandreSongFirstTime9Okina: That doesn't matter. You just need to sing whatever is in your mind, without hiding your emotions.
  FlandreSongFirstTime10Okina: Who knows? Maybe you were actually good at singing and you just didn't knew.
  FlandreSongFirstTime11Flandre: I don't think Magical Girls are supposed to sing while they fight though.
  FlandreSongFirstTimeSelect: Start Singing?
  FlandreSongFirstTimeYes1Flandre: Okay. But don't laugh when you see how badly I sing.
  FlandreSongFirstTimeYes2Okina: Of course. Everyone is bad at first...
  FlandreSongFirstTimeYes3Okina: '!?'
  FlandreSongFirstTimeNo1Flandre: Don't expect me to sing for you.
  FlandreSongFirstTimeNo2Okina: '*sigh* Understood.'
  FlandreSongFirstTimeEnding1Okina: Well that was truly an experience. How do you feel?
  FlandreSongFirstTimeEnding2Flandre: My throat hurts. I'm not used to continuously speaking.
  FlandreSongFirstTimeEnding3Okina: If I had to find something to criticize, it would be that the lyrics were bizarre.
  FlandreSongFirstTimeEnding4Okina: But that's my fault for saying you to sing whatever you want.
  FlandreSongFirstTimeEnding5Okina: So... that was great! Fantastic even!
  FlandreSongFirstTimeEnding6Flandre: Just because you praise me doesn't mean I sing more.
  FlandreSongFirstTimeEnding7Okina: I know. Also, humans really loved that sequence.
  FlandreSongFirstTimeEnding8Flandre: Humans? How?
  FlandreSongFirstTimeEnding9Okina: I was broadcasting your song to the Human Village with my doors.
  FlandreSongFirstTimeEnding10Okina: There are hardly any televisions in the human village, but that doesn't matter for me.
  FlandreSongFirstTimeEnding11Flandre: Are you a god or a paparazzi?
  FlandreSongFirstTimeEnding12Okina: That's rude. I'm just doing my part as your manager.
  FlandreSongFirstTimeEnding13Okina: Humans could barely understand the lyrics, but they were still captivated by your song and combat.
  FlandreSongFirstTimeEnding14Flandre: I'm not really sure what's so exciting about beating someone while singing, but whatever.
  FlandreSongFirstTimeEnding15Okina: So, about your singing...
  FlandreSongFirstTimeEnding16Flandre: No.
  FlandreSongFirstTimeEnding17Okina: Please?
  FlandreSongFirstTimeEnding18Flandre: No.
  FlandreSongFirstTimeEnding19Okina: I will always be waiting for you to change your mind!
