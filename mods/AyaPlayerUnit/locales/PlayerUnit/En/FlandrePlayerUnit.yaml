  FlandreTutorialStage1Name: Stage 1 - Blue
  FlandreTutorialStage1Intro1SukusukuAya: >-
    Suku.

    (Before I teach you, let's start with introducing who you are.)
  FlandreTutorialStage1Intro2SukusukuAya: >-
    Suku.

    (You are {0}. You are a Vampire, but you also have multiple identity, which is Vampire, Devil, and Magical girl.)
  FlandreTutorialStage1Intro3SukusukuAya: >-
    Suku.

    (You're at least 495 years old. You are an younger sister of Remilia Scarlet, Mistress of Scarlet Devil Mansion.)
  FlandreTutorialStage1Intro4SukusukuAya: >-
    Suku.

    (You were locked in a basement by Remilia for 495 years. But you can force your way out if you wanted to.)
  FlandreTutorialStage1Intro5Flandre: Are you trying to call me a shut-in or what?
  FlandreTutorialStage1Intro6SukusukuAya: >-
    Suku.

    (Because you have the ability to destroy absolutely anything.)
  FlandreTutorialStage1Intro7Flandre: Hmph. Everything has its eye, and I have eyes of everything in my hand.
  FlandreTutorialStage1Intro8Flandre: I squeeze the eye, and it went boom!
  FlandreTutorialStage1Intro9SukusukuAya: >-
    Suku!

    (And that's what we're going to learn first!)
  FlandreTutorialStage1Intro10SukusukuAya: >-
    Suku.

    ({0}'s Blue mana represents her ability to destroy absolutely anything. Its main keywords are Calamity and Destroy.)
  FlandreTutorialStage1Intro11SukusukuAya: >-
    Suku.

    (Calamity increases any damage enemies take, even if it was supposed to deal 0 damage. Allowing {0} to deal damage no matter what.)
  FlandreTutorialStage1Intro12SukusukuAya: >-
    Suku.

    (Destroy is pretty simple. When conditions are met, {0} will instantly kill the target.)
  FlandreTutorialStage1Intro13SukusukuAya: >-
    Suku.

    (Your Blue cards also offer card manipulation and more defensive options.)
  FlandreTutorialStage1Intro14SukusukuAya: >-
    Suku!

    (Let me introduce you a helper for the tutorial battle!)
  FlandreTutorialStage1Intro15SukusukuAya: >-
    Suku!

    (Come on, Momiji!)
  FlandreTutorialStage1Intro16SukusukuMomiji: >-
    Suku...

    (Geez, Aya. I was busy patrolling the mountain...)
  FlandreTutorialStage1Intro17SukusukuAya: >-
    Suku.

    (No you're not. You were sleeping.)
  FlandreTutorialStage1Intro18SukusukuAya: >-
    Suku!

    (Now stop whining and help me with my teaching!)
  FlandreTutorialStage1Intro19SukusukuMomiji: >-
    Suku?

    (But we have an actual teacher. Why are you teaching instead of her?)
  FlandreTutorialStage1Intro20SukusukuAya: >-
    Suku.

    (She was hospitalized after getting caught up in the duel between Kaguya and Mokou.)
  FlandreTutorialStage1Intro21SukusukuMomiji: >-
    Suku.

    (Oh...)
  FlandreTutorialStage1Intro22Flandre: That's funny.
  FlandreTutorialStage1Intro23SukusukuAya: >-
    Suku!

    (Anyway, Momiji! Use your shield to take {0}'s attack!)
  FlandreTutorialStage1Intro24SukusukuMomiji: >-
    Suku!

    (Alright!)
  FlandreTutorialStage1Intro25SukusukuMomiji: >-
    ...Suku?

    (...Do you know what you just said?)
  FlandreTutorialStage1Intro26SukusukuAya: >-
    Suku.

    (Take {0}'s attack.)
  FlandreTutorialStage1Intro27SukusukuMomiji: >-
    Suku!

    (It's basically like telling me to stop a nuclear missile with a knife!)
  FlandreTutorialStage1Intro28SukusukuAya: >-
    Suku?

    (Relax, {0} will go easy on you. Right, {0}?)
  FlandreTutorialStage1Intro29Flandre: I hope you have a life insurance!
  FlandreTutorialStage1Intro30SukusukuMomiji: >-
    Suku!!!

    (There is no life insurance for Sukusuku Hakutaku!!!)
  FlandreTutorialStage1Intro31SukusukuAya: >-
    Suku!

    (Your sacrifice will be remembered, Momiji!)
  FlandreTutorialStage1Intro32Flandre: Nah, I was just joking. I'll only use 0% of my power.
  FlandreTutorialStage1Intro33SukusukuMomiji: >-
    Suku?

    (That's not reassuring... 0%?)
  FlandreTutorialStage1BattleWave11Flandre: All my attacks will deal 0 damage, and that's when my Calamity comes in handy!
  FlandreTutorialStage1BattleWave12SukusukuAya: >-
    Suku!

    (Reduce {0}'s Hp to 50% or lower in 1 turn!)
  FlandreTutorialStage1BattleWave21SukusukuMomiji: >-
    Suku...

    (I think one or two of my rib broke...)
  FlandreTutorialStage1BattleWave22SukusukuAya: >-
    Suku.

    (It was your shield that took all the hits, not you.)
  FlandreTutorialStage1BattleWave23SukusukuAya: >-
    Suku!

    (Let's try Destroy!)
  FlandreTutorialStage1BattleWave24SukusukuMomiji: >-
    ...Suku?

    (...Are you serious?)
  FlandreTutorialStage1BattleWave25SukusukuAya: >-
    Suku.

    (No no, You're not the one going to be destroyed.)
  FlandreTutorialStage1BattleWave26SukusukuAya: >-
    Suku.

    (To prevent unnecessary killing, I will bring a target dummy.)
  FlandreTutorialStage1BattleWave27Flandre: I don't like the way you're implying that I committed an unnecessary murder before.
  FlandreTutorialStage1BattleWave28SukusukuMomiji: >-
    Suku?

    (Then what was it?)
  FlandreTutorialStage1BattleWave29Flandre: Natural selection.
  FlandreTutorialStage1BattleWave210SukusukuMomiji: >-
    Suku.

    (I shouldn't have asked.)
  FlandreTutorialStage1BattleWave211Flandre: Just kidding.
  FlandreTutorialStage1BattleWave212Flandre: Those dark lore about Touhou Project were created back when ZUN had Chuunibyou.
  FlandreTutorialStage1BattleWave213Flandre: Nowadays, these are just a convenient material to create horror themed fanworks.
  FlandreTutorialStage1BattleWave214Flandre: For example, there are bunch of doujinshis where I'm playing with other Touhou characters. They end up brutally murdered.
  FlandreTutorialStage1BattleWave215SukusukuMomiji: >-
    Suku.

    (You didn't have to give an example.)
  FlandreTutorialStage1BattleWave216SukusukuMomiji: >-
    Suku.

    (Also, can you stop break 4th wall? You're not supposed to do that.)
  FlandreTutorialStage1BattleWave217Flandre: But I'm canonically 4th wall breaking character.
  FlandreTutorialStage1BattleWave218SukusukuMomiji: >-
    ...

    (...)
  FlandreTutorialStage1BattleWave219SukusukuAya: >-
    Suku.

    (This target dummy has 9999 life.)
  FlandreTutorialStage1BattleWave220Flandre: Wow, what is that dummy made of?
  FlandreTutorialStage1BattleWave221SukusukuAya: >-
    Suku.

    (Hay bale.)
  FlandreTutorialStage1BattleWave222Flandre: Eh-
  FlandreTutorialStage1BattleWave223SukusukuAya: >-
    Suku!

    (Instead of trying to deal that much damage, Destroy it!)
  FlandreTutorialStage1BattleWave224SukusukuAya: >-
    Suku!

    (Defeat target dummy in 1 turn!)
  FlandreTutorialStage1BattleWave31SukusukuAya: >-
    Suku.

    (Now that's a really scary ability.)
  FlandreTutorialStage1BattleWave32SukusukuAya: >-
    Suku.

    (As for final battle, I have prepared perfect opponent for you.)
  FlandreTutorialStage1BattleWave33SukusukuAya: >-
    Suku!

    (Rabbits!)
  FlandreTutorialStage1BattleWave34FraudRabbit: You have received 2 Moriyacoin MRC. Please confirm transaction by clicking link:https://store.steampowered.com/app/1140150/Touhou_Lost_Branch_of_Legend/
  FlandreTutorialStage1BattleWave35SukusukuMomiji: >-
    Suku!

    (It's a scammer!)
  FlandreTutorialStage1BattleWave36Flandre: I despise people who try to make money without working.
  FlandreTutorialStage1BattleWave37SukusukuMomiji: >-
    Suku.

    (That's because you don't need to work.)
  FlandreTutorialStage1BattleWave38HardworkingRabbit: Earthling spotted! Engaging combat!
  FlandreTutorialStage1BattleWave39LazyRabbit: Let's see... 3 minutes should be enough to eliminate this earthling.
  FlandreTutorialStage1BattleWave310Flandre: You know, I'm not a Misfortune God and yet I can feel a tremendous amount of grudges against those rabbits.
  FlandreTutorialStage1BattleWave311Flandre: They must be really hated.
  FlandreTutorialStage1BattleWave312SukusukuMomiji: >-
    Suku.

    (An enemy that takes 1 damage from anything never had good impression in many games.)
  FlandreTutorialStage1BattleWave313SukusukuAya: >-
    Suku!

    (Time to show them there is nothing you can't destroy, {0}!)
  FlandreTutorialStage1BattleWave314SukusukuAya: >-
    Suku!

    (Defeat all enemies in 3 turn!)
  FlandreTutorialStage1Outro1SukusukuAya: >-
    Suku.

    (In conclusion, {0}'s Blue cards are about destroying enemies no matter what.)
  FlandreTutorialStage1Outro2SukusukuAya: >-
    Suku!

    (Good thing you aren't destroyed, Momiji!)
  FlandreTutorialStage1Outro3SukusukuMomiji: >-
    Suku.

    (Yeah, if I��d known who I��d be dealing with, I wouldn��t have come here.)
  FlandreTutorialStage1Outro4SukusukuAya: >-
    Suku?

    (Ayaya, Who am I suposed to get help if you don't help me?)
  FlandreTutorialStage1Outro5SukusukuMomiji: >-
    Suku.

    (Hatate.)
  FlandreTutorialStage1Outro6SukusukuAya: >-
    Suku.

    (Not gonna happen.)
  FlandreTutorialStage1Outro7SukusukuMomiji: >-
    Suku.

    (I knew you'd say that.)
