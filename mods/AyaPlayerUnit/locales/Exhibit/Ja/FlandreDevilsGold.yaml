FlandreDevilsGold:
  Description: >-
    {PlayerName}が|破滅|を付与するたび、さらに{Value1}の|破滅|を付与する。

    |破滅|を持つ敵が倒されるたび、{Value2}<sprite="Point" name="Gold">を得る。
  Name: 悪魔の金貨
  FlavorText: >-
    「もし人々がお金を願い、私はその願いを叶え、そしてそのお金を生け贄として受け取ったら……幻想郷のルールを破ることになるのかしら？」

    ―フランドール・スカーレット

    「……いいえ。」

    ―摩多羅隠岐奈

    「お小遣い稼ぎの時間ね！」

    ―フランドール・スカーレット

    「時々、あなたが本当に悪魔なんだと実感する瞬間があるけれど、今がまさにそれね。」

    ―摩多羅隠岐奈
