AyaG:
  Description: >-
    마나 풀에 {BaseMana}가 추가됩니다. |아야|의 전용 카드가 카드 풀에 추가됩니다.

    매 턴 |액운|또는 상태 카드가 처음 |소멸|할 때 마다, {Mana}를 얻습니다.

    |붕붕마루 신문|이 피해를 {Value1} 주고, |록 온|을 {Value2} 주고, |보충|을 얻습니다.

    |화과자념보|가 |보충|을 얻습니다.
  Name: 아야의 카메라
  FlavorText: 한때 사용되었던 바깥세상의 카메라와 비슷한 외관이지만, 이 카메라는 필름을 사용하여 진실과 환상을 포착하기 위해 갓파들이 만들었습니다.
