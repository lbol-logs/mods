  FlandreTutorialStage1Intro13SukusukuAya: "Suku.\n(Your Blue cards also offer card manipulation and more defensive options.)"
  FlandreTutorialStage1Intro14SukusukuAya: "Suku!\n(Let me introduce you a helper for the tutorial battle!)"
