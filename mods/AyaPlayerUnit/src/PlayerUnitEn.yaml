  AyaBribery6Megumu: "I'll decide your punishment later. For now, I should reward you for all that money..."
  AyaBribery7Megumu: "Right. I heard you're collecting those cards? I'll give you my card."
  AyaBribery8Aya: "Of course! I am truly honored to receive your gift!"
  AyaBribery9Aya: "Whaaaaaaat? What a Pain! Do I really have to carry her card?\nShit Shit Shit Shit"
