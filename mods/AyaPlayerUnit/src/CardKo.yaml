  ExtraDescription4: "{FriendU}|d:\u300C무쌍풍신\u300D: 전투중에 한 번만 사용할 수 있습니다. 모든 적에게 피해를 {Damage}씩 {Value2}번 줍니다. 적들은 이번 턴 행동할 수 없습니다. {PlayerName}의 다음 턴 시작시 이 효과를 반복합니다. 명중|"
