  Line28A: "세 개의 목을 가진 경비견이라 해도"
  Line29: "魂も刈り取ってって　Yeah-Yeah！"
  Line29A: "영혼까지 뜯어내 버려　Yeah-Yeah!"

  Line30: "イージーなゲームなんて"
  Line30A: "쉬운 게임 따위는"
  Line31: "プレイする意味ないの　ルナティック"
  Line31A: "플레이할 의미 없어　루나틱"
  Line32: "あの頃と違うなんて"
  Line32A: "그때와 다르다니"
  Line33: "駄々こねるヴァンパイア　嗚呼、嫌、嫌"
  Line33A: "삐져대는 뱀파이어　아아, 싫어, 싫어"
  Line34: "過激派なヴァンパイア　嫌、嫌！"
  Line34A: "과격파 뱀파이어　싫어, 싫어!"
  
  Line35: "破壊破壊で無問題　過激過激な吸血鬼"
  Line35A: "파괴 파괴, 문제없어. 과격 과격한 뱀파이어"
  Line36: "情緒不安定に剪定　破滅破滅支離滅裂"
  Line36A: "정서 불안정하게 잘라내, 파멸 파멸, 산산조각"
  Line37: "殲滅せよ！"
  Line37A: "전멸시켜라!"

  Line38: "地獄の門番だなんて"
  Line38A: "지옥의 문지기라니"
  Line39: "私にとってはただのオモチャ"
  Line39A: "나에게는 그저 장난감일 뿐"
  Line40: "三つ首番犬だって"
  Line40A: "세 목의 경비견이라 해도"
  Line41: "魂も刈り取ってって　Yeah-Yeah！"
  Line41A: "영혼까지 뜯어내 버릴 거야, Yeah-Yeah!"

  Line42: "イージーな扉なんて"
  Line42A: "쉬운 문 따위는"
  Line43: "開く意味はないの　ストイック"
  Line43A: "열 의미 없어, 스토익"
  Line44: "張り合いがないだなんて"
  Line44A: "재미없다니"
  Line45: "そんなのが1番　ヴァンパイア、嫌"
  Line45A: "그런 게 제일 싫어, 뱀파이어, 싫어"
