#For translators: Don't translate original lyrics.
FlandreSongFlandol:
  Line1: "完全無欠のヴァンパイア"
  Line1A: "완전무결의 벰파이어"
  Line2: "破壊するその手でブレイクアウト"
  Line2A: "파괴하는 그 손으로 브레이크 아웃"
  Line3: "彼女の人生浴びたらクリア"
  Line3A: "​​​그녀의 인생을 덮어쓰면 클리어"
  Line4: "強さで心奪う君は"
  Line4A: "힘으로 마음을 빼앗는 너는"
  Line5: "悪魔的な妹様"
  Line5A: "​​​악마적인 여동생님"

  Line6: "ああ何年地下に閉じこもって"
  Line6A: "아아 몇년을 지하에 틀어박혀선"
  Line7: "独り過去を刻んでいたの？"
  Line7A: "​​​혼자서 과거를 새겨왔었니?"
  Line8: "ああ好きな血液型はわからない？"
  Line8A: "아아 좋아하는 혈액형은 모르니?"
  Line9: "ミステリアスなシスターヴァンプ"
  Line9A: "​​​미스테리어스한 시스터 벰프"

  Line10: "常に飄々と　だけど爛漫で"
  Line10A: "항상 살랑하게 하지만 산만하게"
  Line11: "禁忌は甘い果実味"
  Line11A: "​​​금기란 달콤한 과일맛"
  Line12: "ああボムもないないない"
  Line12A: "아아 봄도 없어 없어 없어"
  Line13: "残機ないないない"
  Line13A: "​​​잔기 없어 없어 없어"
  Line14: "1位になった感想は？"
  Line14A: "1등이 된 소감은?"

  Line15: "「誰かの<好き>になれるなんてよく分からなくて」"
  Line15A: "​​​「누군가의 ＜최애＞가 된다는게 뭔지 잘 모르겠어서」"
  Line16: "興味があるかわからない"
  Line16A: "흥미가 있는지도 모르겠어"
  Line17: "そんな言葉に また抱え落ちる"
  Line17A: "​​​그런 말에 다시 고통 받아가"
  Line18: "また推しにさせる"
  Line18A: "다시 최애로 만들어"

  Line19: "誰もが一度は好きになる"
  Line19A: "​​​누구나 한번쯤은 좋아하게 되는"
  Line20: "最強妹フランドール"
  Line20A: "최강 여동생 플랑도르"
  Line21: "他の作品トコじゃ味わえない"
  Line21A: "​​​다른작품에서 느낄 수 없는"
  Line22: "神が生み落とした伝説"
  Line22A: "신주가 창조한 전설"

  Line23: "ああそのスリルな弾幕"
  Line23A: "​​​아아 그 스릴 넘치는 탄막"
  Line24: "誰も彼もが虜になってゆく"
  Line24A: "누구나 그것에 매료되게 돼"
  Line25: "紅い瞳もセリフも"
  Line25A: "​​​붉은 눈동자도 대사도"
  Line26: "織り成すその全て"
  Line26A: "엮어낸 그 모든 것"
  Line27: "フランドール"
  Line27A: "​​​플랑도르"

  Line28: "はいはい私は悪い子です"
  Line28A: "네~네~ 저는 나쁜아이 예요"
  Line29: "だから幽閉されてるんです"
  Line29A: "​​​그래서 감금 되어 있는 거예요"
  Line30: "お姉様のおまけの妹です"
  Line30A: "언니님의 떨이상품인 동생이예요"
  Line31: "全て言いなりで終わらせたくない"
  Line31A: "​​​모든것을 말하는대로 끝내고 싶지 않아"
  Line32: "ここの部屋の鍵壊せない訳ない"
  Line32A: "이곳의 열쇠를 부수지 않을 이유가 없어"
  Line33: "だけど壊さないだって上手く使えない"
  Line33A: "​​​하지만 부수지 않아 왜냐면 잘 다룰 수 없어"
  Line34: "籠の鳥の私なんて許せはしない"
  Line34A: "​​​새장 안의 새인 나를 용서할 수 없어"
  Line35: "鏡に映らない自分のこと許せない"
  Line35A: "거울에 비치지않는 ​​​나 자신을 용서 할 수 없어"

  Line36: "誰もが一度は好きになる"
  Line36A: "누구나 한번쯤은 좋아하게 되는"
  Line37: "真紅の妹フランドール"
  Line37A: "​​​진홍의 여동생 플랑도르"
  Line38: "弱点は流れる水と"
  Line38A: "약점은 흐르는 물과"
  Line39: "熱く輝いてる太陽"
  Line39A: "​​​열정적으로 빛나고 있는 태양"

  Line40: "ああ弱いとこだって魅力で"
  Line40A: "아아 약점인 부분도 매력으로"
  Line41: "それぞれの解釈で広がった"
  Line41A: "​​​각자의 해석으로 확장되었어"
  Line42: "あなたの幻想郷"
  Line42A: "당신의 환상향"
  Line43: "そこに居るあなたのフランドール"
  Line43A: "​​​그곳에 있는 당신의 플랑도르"

  Line44: "天使の笑顔のヴァンパイア"
  Line44A: "천사 미소의 뱀파이어"
  Line45: "コンティニューできないのここは"
  Line45A: "​​​컨티뉴 할 수 없는 이곳은"
  Line46: "レーヴァテインは神話のレプリカ"
  Line46A: "​​​레바테인은 신화의 레플리카"
  Line47: "迷路の出口こそが愛だ"
  Line47A: "미로의 출구는 바로 사랑이다"
  Line48: "紅い霧で隠すレミリア"
  Line48A: "​​​붉은 안개에 가려진 레밀리아"
  Line49: "完璧にこなすのは咲夜"
  Line49A: "완벽하게 처리하는건 사쿠야"
  Line50: "七色の羽根の私がイデア"
  Line50A: "​​​일곱빛깔 날개를 가진 나는 이데아"
  Line51: "弾幕はとびきりの愛だ"
  Line51A: "탄막은 최고의 사랑이야"

  Line52: "これまで愛されたことも"
  Line52A: "​​​지금까지 사랑받았던 때도"
  Line53: "愛せたこともないと思ってた"
  Line53A: "사랑했던 때도 없다 생각했었어"
  Line54: "そんな私があなたの推しになれたのは"
  Line54A: "​​​그런 내가 당신의 최애가 될 수 있었던 것은"
  Line55: "本当だから"
  Line55A: "진심이니까"
  Line56: "ありがとう"
  Line56A: "​​​고마워"

  Line57: "これからもきっと狂わせていく"
  Line57A: "앞으로도 분명 미치게 만들"
  Line58: "私欲張りフランドール"
  Line58A: "​​​난 욕심많은 플랑도르"
  Line59: "この居場所でみんなのこと"
  Line59A: "이 자리에서 모두를"
  Line60: "愛し壊し続けたいから"
  Line60A: "​​​사랑하며 파괴하고 싶으니까"

  Line61: "ああ今日もスペルで勝負"
  Line61A: "아아 오늘도 스펠로 승부"
  Line62: "未熟だけれど世界も救ったよ"
  Line62A: "​​​미숙하지만 세계도 구했다구요"
  Line63: "それでもまだ届かなくて"
  Line63A: "그럼에도 아직 도달하지 못해서"
  Line64: "伝えられずにいたけど"
  Line64A: "​​​전하지 못했지만"

  Line65: "今ならもう言えるかも"
  Line65A: "이제라면 전할 수 있을지도"
  Line66: "これからもずっと愛してる"
  Line66A: "​​​앞으로도 계속 사랑해"
FlandreSongRadicalVampire:
  Line1: "あなたのその力　私にぶつけて"
  Line1A: "그 힘, 나에게 쏟아부어"
  Line2: "ぐちゃぐちゃになるまで　私に試して"
  Line2A: "엉망이 될 때까지, 나에게 시험해 봐"

  Line3: "水は苦手だけど　特訓するから"
  Line3A: "물은 잘 못하지만, 특훈할 테니까"
  Line4: "ドロドロになっても　私にやらせて？"
  Line4A: "진흙투성이가 되어도, 나에게 맡겨줄래?"

  Line5: "破壊破壊で無問題　過激過激な吸血鬼"
  Line5A: "파괴 파괴, 문제없어. 과격 과격한 뱀파이어"
  Line6: "情緒不安定に剪定　破滅破滅支離滅裂"
  Line6A: "정서 불안정하게 잘라내, 파멸 파멸, 산산조각"
  Line7: "殲滅せよ！"
  Line7A: "전멸시켜라!"

  Line8: "地獄の門番だなんて"
  Line8A: "지옥의 문지기라니"
  Line9: "私にとってはただのオモチャ"
  Line9A: "나에게는 그저 장난감일 뿐"
  Line10: "三つ首番犬だって"
  Line10A: "세 목의 경비견이라 해도"
  Line11: "魂も刈り取ってって　Yeah-Yeah！"
  Line11A: "영혼까지 뜯어내 버릴 거야, Yeah-Yeah!"

  Line12: "イージーな扉なんて"
  Line12A: "쉬운 문 따위는"
  Line13: "開く意味はないの　ストイック"
  Line13A: "열 의미 없어, 스토익"
  Line14: "張り合いがないだなんて"
  Line14A: "재미없다니"
  Line15: "そんなのが1番　ヴァンパイア、嫌"
  Line15A: "그런 게 제일 싫어, 뱀파이어, 싫어"
  Line16: "過激派なヴァンパイア　嫌、嫌！"
  Line16A: "과격파 뱀파이어, 싫어, 싫어!"

  Line17: "あの頃のあなたは全てを破壊するよな目してたのに"
  Line17A: "그때의 너는 모든 것을 파괴할 듯한 눈빛이었는데"
  Line18: "どうして　なんでなんでなんでそんなの"
  Line18A: "어째서, 왜 왜 왜 그런 건지"
  Line19: "解釈違い　デッドライン"
  Line19A: "해석 차이, 데드라인"
  Line20: "Ah"
  Line20A: "Ah"

  Line21: "石油石油のセンセーション"
  Line21A: "석유 석유의 센세이션"
  Line22: "過激過激な吸血鬼"
  Line22A: "과격 과격한 뱀파이어"
  Line23: "解釈違いは仲違い"
  Line23A: "해석 차이는 불화"
  Line24: "修羅場修羅場でバラバラに"
  Line24A: "수라장 수라장에서 산산조각 나"
  Line25: "殲滅せよ！"
  Line25A: "전멸시켜라!"

  Line26: "地獄の門番だなんて"
  Line26A: "지옥의 문지기라니"
  Line27: "私にとってはただのオモチャ"
  Line27A: "나에게는 그저 장난감일 뿐"
