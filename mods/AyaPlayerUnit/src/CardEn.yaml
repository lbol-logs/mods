  AyaShameimarusCoerciveReportingDetonate3Aya: "This person right here, officer."
  AyaShameimarusCoerciveReportingDetonate4Rin: "Wait! I can explain!"
  AyaShameimarusCoerciveReportingDetonate5Rin: "Satori-sama! Help me!"
