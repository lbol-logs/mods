AyaPlayerUnit:
  Title: 幻想乡的传统记者
  AyaSelect: 选择
  AyaBribery1Megumu: "你今天很奇怪，文文。一边揍我一边给我钱。"
  AyaBribery2Aya: "等等。你不挡我的路？"
  AyaBribery3Megumu: "我为什么要砸自己的招牌？"
  AyaBribery4Megumu: "不过你二话不说就开始攻击我，而我对于挑战者来者不拒。"
  AyaBribery5Aya: "呃...我不是来挑战你的。请手下留情。"
  AyaBribery6Megumu: "我等会再收拾你。现在，我应该奖你点金币..."
  AyaBribery7Megumu: "对了。我听说你在收集那些卡牌？我把我的卡牌给你。"
  AyaBribery8Aya: "当然！能收到你的礼物，我深感荣幸！"
  AyaBribery9Aya: "什么？真麻烦！我真的要带着她的卡牌吗？\n糟了糟了糟了糟了"
  AyaBribery10Megumu: "你的对话混在一起了~"
  AyaFastAttack1Aya: "不行。"
  AyaFastAttack2Aya: "哎呀呀。"
  AyaFastAttack3Aya: "再努力点。"
  AyaExtraBoss1SukusukuAya: "斯库？\n(你在寻找挑战吗？)"
  AyaExtraBossFlandre1SukusukuAya: "斯库...\n(让我们稍微倒回时间...)"
  AyaExtraBossFlandre2Aya: "咦？"
  AyaExtraBossFlandre3Flandre: "呃。"
  AyaExtraBossFlandre4Flandre: "就这样？"
  AyaExtraBossFlandre5Aya: "哎呀，我没想到会在这里见到红魔馆的妹妹。"
  AyaExtraBossFlandre6Flandre: "嗯？你是...{0}，对吧？"
  AyaExtraBossFlandre7Aya: "没错！作为一个正直诚实的记者，我正准备采访这次事件的罪魁祸首。"
  AyaExtraBossFlandre8Aya: "直到你在一瞬间击败了她。"
  AyaExtraBossFlandre9Flandre: "事件的罪魁祸首通常不是很强吗？"
  AyaExtraBossFlandre10Aya: "不总是。而且，能承受你力量的人很少。"
  AyaExtraBossFlandre11Flandre: "我期待一个坚固的玩具..."
  AyaExtraBossFlandre12Flandre: "...你有多强？"
  AyaExtraBossFlandre13Aya: "至少比那个用魔法道具的天邪鬼强。"
  AyaExtraBossFlandre14Flandre: "我无聊了。跟我打。"
  AyaExtraBossFlandre15Aya: "哎呀呀。其实那是个玩笑，我是最弱的鸦天狗..."
  AyaExtraBossFlandre16Flandre: "别撒谎。你以为我忘了你采访我的时候吗？"
  AyaExtraBossFlandre17Flandre: "躲开我所有的攻击，同时拍照，甚至没有还手。"
  AyaExtraBossFlandre18Flandre: "所以别抱怨了，跟我来！"
  AyaExtraBossFlandre19Aya: "什么-"
  AyaExtraBossFlandre20Aya: "救命！我被绑架了！"
  AyaExtraBossFlandre21Flandre: "嘿，别反抗。否则我就毁掉太阳，这样我们就能在这里打了。"
  AyaExtraBossFlandre22Aya: "哎呀呀呀呀呀呀呀呀！！！"
  AyaSkipDialogue: 你想跳过对话吗？
  AyaChapterSelect: 章节选择
  AyaChapter1Act1AyaTanukiIntro1AyaTanuki: "啊！你在干什么！"
  AyaChapter1Act1AyaTanukiIntro2Aya: "你连那个都躲不开，还伪装成我？"
  AyaChapter1Act1AyaTanukiIntro3Aya: "现在是时候为你的罪行付出代价了。"
  AyaChapter1Act1AyaTanukiIntro4AyaTanuki: "呃哦..."
  AyaChapter1Act21AyaTanuki: "所以，发生了什么？"
  AyaChapter1Act22Aya: "辉夜又举办了一次展览。这次，客人可以选择带走一件展品。"
  AyaChapter1Act23Aya: "显然她的宝物不包括在内，但显然有人决定无视这个规则。"
  AyaChapter1Act24Aya: "她说，任何带回丢失宝物的人都可以带走她的一件宝物。现在每个人都在寻宝。"
  AyaChapter1Act25AyaTanuki: "我看到很多人从永远亭冲出来，但不知道有展览。"
  AyaChapter1Act26AyaTanuki: "你也在找宝物吗？"
  AyaChapter1Act27Aya: "不，我在找新闻！"
  AyaChapter1Act28Aya: "这个敢偷辉夜公主宝物的神秘人是谁？"
  AyaChapter1Act29Aya: "我们已经在路上看到了很多展品。这会对幻想乡产生什么影响？"
  AyaChapter1Act210Aya: "如果这是更大阴谋的一部分，幕后黑手是谁？"
  AyaChapter1Act211Aya: "哎呀呀！这不是很有趣吗？"
  AyaChapter1Act212AyaTanuki: "也许？"
  AyaChapter1Act213Aya: "你呢？你对宝物感兴趣吗？"
  AyaChapter1Act214AyaTanuki: "我要闪亮的东西干嘛？我算了。"
  AyaChapter1Act215Aya: "..."
  AyaChapter1Act216AyaTanuki: "为什么？"
  AyaChapter1Act217Aya: "你真是太纯洁天真了..."
  AyaChapter1Act218Aya: "连妖精都在试图获取宝物..."
  AyaChapter1Act219AyaTanuki: "咳咳，我就当是夸奖了。"
  AyaChapter1Act220Aya: "我们继续前进吧。"
  AyaChapter1Act221Aya: "根据我的情报，罪魁祸首逃到了妖怪山。"
  AyaChapter1Act31Aya: "我觉得你不该再跟着我了。"
  AyaChapter1Act32AyaTanuki: "但是..."
  AyaChapter1Act33Aya: "太危险了，尤其是我们不知道罪魁祸首的能力。"
  AyaChapter1Act34Aya: "这里相对安全，所以就在这里等吧。我保证会带着好消息回来。"
  AyaChapter1Act35AyaTanuki: "如果你这么说..."
  AyaChapter1Act36AyaTanuki: "如果我悄悄跟着应该没问题。"
  AyaChapter1Act4SeijaPhase11Seija: "对于一个三流报纸记者来说，还不错。"
  AyaChapter1Act4SeijaPhase12Aya: "哦，我作为记者的技能是众所周知的。"
  AyaChapter1Act4SeijaPhase13Aya: "所以你就这点本事？那么..."
  AyaChapter1Act4SeijaPhase14Seija: "还没完呢，乌鸦！你还没看到真正的本事！"
  AyaChapter1Act4SeijaPhase15Seija: "让我告诉你什么是化不可能为可能！"
  AyaChapter1Act4SeijaPhase16Aya: "现在这个采访对象相当有趣..."
  AyaChapter1Act4SeijaPhase2Hidden1Aya: "你看，如果我能化不可能为可能，我就不会从一开始就称之为不可能了。"
  AyaChapter1Act4SeijaPhase2Hidden2Koishi: "...？"
  AyaChapter1Act4SeijaPhase21Seija: "愚蠢的记者被解决了...咦？"
  AyaChapter1Act4SeijaPhase22Seija: "你还在坚持？挺厉害的。"
  AyaChapter1Act4SeijaPhase23Aya: "记者有责任传播真相..."
  AyaChapter1Act4SeijaPhase24Seija: "真相？嗯，我确实有真相。"
  AyaChapter1Act4SeijaPhase25Seija: "出来吧，各位。"
  AyaChapter1Act4SeijaPhase26Reimu: "多亏了你的破报纸，我成了博丽的黑帮。"
  AyaChapter1Act4SeijaPhase27Marisa: "我从未偷过任何东西。别每次我借东西都拍照，daze。"
  AyaChapter1Act4SeijaPhase28Sakuya: "我的主人命令我处理那些制造不存在丑闻的假记者。"
  AyaChapter1Act4SeijaPhase29Cirno: "我不确定...但停止撒谎不是更好吗？"
  AyaChapter1Act4SeijaPhase210Seija: "真相是，你并不比我好。"
  AyaChapter1Act4SeijaPhase211Aya: "哎呀呀..."
  AyaChapter1Act4SeijaPhase212Seija: "在'我们'把你打晕之前，还有什么遗言吗？"
  AyaChapter1Act4SeijaPhase213Aya: "哎呀呀呀呀呀呀！"
  AyaChapter1Act4SeijaPhase214Seija: "什么..."
  AyaChapter1Act4SeijaPhase215Aya: "看这个！这是事件罪魁祸首和解决者勾结的场景！"
  AyaChapter1Act4SeijaPhase216Aya: "这是真的吗？幻想乡真的没有正义吗？"
  AyaChapter1Act4SeijaPhase217Aya: "你不能错过如此珍贵的场景！标题是..."
  AyaChapter1Act4SeijaPhase3Normal1Cirno: "对不起，文文..."
  AyaChapter1Act4SeijaPhase3True1Cirno: "文文，我..."
  AyaChapter1Act4SeijaPhase3True2Aya: "不需要道歉。我不是一个非常诚实的记者。"
  AyaChapter1Act4SeijaPhase3True3Aya: "但这次，我保证写一篇能自豪地展示给你的文章。"
  AyaChapter1Act4SeijaPhase3True4Cirno: "..."
  AyaChapter1Act4SeijaPhase3True5Cirno: "你能再答应我一件事吗？"
  AyaChapter1Act4SeijaPhase3True6Aya: "文文？"
  AyaChapter1Act4SeijaPhase3True7Cirno: "别输。"
  AyaChapter1Act4SeijaPhase3True8Aya: "当然！"
  AyaChapter1Act4SeijaPhase31Seija: "还有很多人讨厌你！"
  AyaChapter1Act4SeijaPhase32Megumu: "我不是。"
  AyaChapter1Act4SeijaPhase33Seija: "什么？"
  AyaChapter1Act4SeijaPhase34Seija: "你背叛我？"
  AyaChapter1Act4SeijaPhase35Megumu: "我什么时候是你的盟友了？"
  AyaChapter1Act4SeijaPhase36Megumu: "闯入山里，制造混乱，然后寻求帮助？"
  AyaChapter1Act4SeijaPhase37Megumu: "是时候赶走不受欢迎的客人了。"
  AyaChapter1Act4SeijaPhase38Seija: "我还没完！我还有强大的盟友！"
  AyaChapter1Act4SeijaPhase39Seija: "你是..."
  AyaChapter1Act4SeijaPhase310Seija: "你是怪物吗？"
  AyaChapter1Act4SeijaPhase311Seija: "等等，等等！"
  AyaChapter1Act4SeijaPhase312Seija: "我很抱歉！我会归还树枝！"
  AyaChapter1Act4SeijaPhase3Normal2Megumu: "我想结束了。"
  AyaChapter1Act4SeijaPhase3Normal3Megumu: "走吧，文文。"
  AyaChapter1Act4SeijaPhase3Normal4Megumu: "文文生气的时候真的很可怕~"
  AyaChapter1Act4SeijaPhase3True9Megumu: "我想结束了。"
  AyaChapter1Act4SeijaPhase3True10Megumu: "走吧，文文。"
  AyaChapter1Act4SeijaPhase3True11Aya: "有人在等我。"
  AyaChapter1Act4SeijaPhase3True12Megumu: "哦？"
  AyaChapter1Act4SeijaPhase3True13Aya: "她在等我承诺的好消息。"
  AyaChapter1Act4SeijaPhase3True14Megumu: "我怎么能阻止你？做你的事吧。"
  AyaChapter1Act4SeijaPhase3True15Aya: "谢谢你，饭纲丸大人。"
  AyaChapter1Act4SeijaPhase3True16Megumu: "..."
  AyaChapter1Act4SeijaPhase3True17Megumu: "你为什么不出来？你以为我没注意到你在看吗？"
  AyaChapter1Act4SeijaPhase3True18Megumu: "沉默是答案...让我给你一个建议。"
  AyaChapter1Act4SeijaPhase3True19Megumu: "别碰我的文文。"
  AyaChapter1Act4SeijaPhase3True20Okina: "..."
  AyaChapter1Act4SeijaPhase3True21AyaTanuki: "*喘气* *喘气*"
  AyaChapter1Act4SeijaPhase3True22AyaTanuki: "文文...太快了..."
  AyaChapter1Act4SeijaPhase3True23AyaTanuki: "她一定已经击败了罪魁祸首。"
  AyaChapter1Act4SeijaPhase3True24AyaTanuki: "那是什么？"
  AyaChapter1Act4SeijaPhase3True25AyaTanuki: "一根镶有宝石的树枝...这不是丢失的宝物吗？"
  AyaChapter1Act4SeijaPhase3True26AyaTanuki: "所以..."
  AyaChapter1Act4SeijaPhase3True27AyaTanuki: "文文在哪儿？"

