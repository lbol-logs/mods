  AyaChapter1Act27Aya: "違うわよ、私はスクープを探してるの！"
  AyaChapter1Act28Aya: "輝夜姫の宝物を盗むなんて大胆な、この謎の人物は一体誰なのかしら？"
  AyaChapter1Act29Aya: "ここに来るまでに、たくさんの展示品が荒らされてたわ。この事件が幻想郷に与える影響は・・・？"
  AyaChapter1Act210Aya: "もしこれが何か大きな陰謀の一部だとしたら、黒幕は誰？"
  AyaChapter1Act211Aya: "あややや！面白くなってきたわねぇ！"
  AyaChapter1Act212AyaTanuki: "そ、そうかも？"
  AyaChapter1Act213Aya: "あなたは？ お宝に興味あるの？"
  AyaChapter1Act214AyaTanuki: "キラキラした物なんてもらっても困るし、遠慮しとくわ。"
  AyaChapter1Act215Aya: "..."
  AyaChapter1Act216AyaTanuki: "なに？"
  AyaChapter1Act217Aya: "あなたってどれだけ純粋で無垢なのよ・・・"
  AyaChapter1Act218Aya: "妖精たちでさえ、宝を手に入れようとしてるの・・・"
  AyaChapter1Act219AyaTanuki: "えへん、それは褒め言葉として受け取っとくわ。"
  AyaChapter1Act220Aya: "さあ、先に進みましょう。"
  AyaChapter1Act221Aya: "私の情報によると、犯人は妖怪の山に逃げたみたい。"
