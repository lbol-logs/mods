  AyaChapter1Act23Aya: "もちろん彼女の宝物は対象外なんだけど、どうやらそれを無視した人がいたみたい。"
  AyaChapter1Act24Aya: "それで、無くなった宝物を見つけて戻してくれたら、お礼に宝物を一つ譲るって言い出して・・・みんな宝探しに夢中なのよ。"
  AyaChapter1Act25AyaTanuki: "永遠亭からたくさん人が飛び出して行ったの見たけど、展示会があったなんて知らなかった。"
