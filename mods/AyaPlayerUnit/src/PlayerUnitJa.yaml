  FlandreSongFirstTimeEnding9Okina: "私の扉を使って、あなたの歌を人間の里に放送していたのよ。"
  FlandreSongFirstTimeEnding10Okina: "人間の里にはテレビなんてほとんどないけれど、私には関係ないわ。"
  FlandreSongFirstTimeEnding11Flandre: "あなたって神様なの？それともパパラッチ？"
  FlandreSongFirstTimeEnding12Okina: "失礼ね。私はあなたのマネージャーとして仕事をしているだけよ。"
