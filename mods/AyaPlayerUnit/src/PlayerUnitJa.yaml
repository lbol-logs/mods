  AyaChapter1Act32AyaTanuki: "でも・・・"
  AyaChapter1Act33Aya: "危険すぎるわ。犯人が何者かも分かってないんだから。"
  AyaChapter1Act34Aya: "ここはまだ比較的安全だから、ここで待ってて。ちゃんと良い知らせを持って戻るから。"
  AyaChapter1Act35AyaTanuki: "わかった・・・そう言うなら・・・"
  AyaChapter1Act36AyaTanuki: "そ?っとついて行くくらいなら、問題ないでしょ。"
  AyaChapter1Act4SeijaPhase11Seija: "三流新聞記者にしては悪くないじゃない。"
