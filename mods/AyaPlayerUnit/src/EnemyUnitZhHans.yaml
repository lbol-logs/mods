  AyaTanukiDying1AyaTanuki: "文文很强...但是！"
  AyaTanukiDying2AyaTanuki: "在我展示终极招式之前，我绝不会倒下！"
  AyaTanukiWaterpower1AyaTanuki: "我的攻击会变得更强！害怕吧！"
  AyaTanukiWaterpower2AyaTanuki: "或者别害怕。"
  AyaTanukiSprite1AyaTanuki: "我听说精神能提高我的防御能力！"
  AyaTanukiSprite2AyaTanuki: "至少它很清爽。"
  AyaTanukiAMOLED1AyaTanuki: "我要变得免疫debuff了！"
  AyaTanukiAMOLED2AyaTanuki: "我太菜了。"
  AyaTanukiExtremeTurn1AyaTanuki: "文文的回合永远不会到来！我发动额外回合！"
  AyaTanukiExtremeTurn2AyaTanuki: "呃，为什么前面有堵墙"
  AyaTanukiExtremeTurn3AyaTanuki: "喵啊啊啊啊啊！！！"
  AyaTanukiExtremeTurn4AyaTanuki: "请假装什么都没发生。"
  AyaTanukiOpticalChameleon1AyaTanuki: "文文永远无法突破我的防御策略。"
  AyaTanukiOpticalChameleon2AyaTanuki: "等等，你去哪儿？回来！"
  AyaTanukiOpticalChameleon3AyaTanuki: "...咦？"
  AyaTanukiOpticalChameleon4AyaTanuki: "痛痛痛痛痛痛痛。"
  AyaTanukiUltimate1AyaTanuki: "来了！我的终极符卡！"
  AyaTanukiUltimate2AyaTanuki: "这是终结一切的攻击！"
  AyaTanukiUltimate3AyaTanuki: "呀啊啊啊啊啊！！！"
  AyaTanukiOutro1AyaTanuki: "嘿！你不该躲开那个的！"
  AyaTanukiOutro2AyaTanuki: "文文没认真对待。认真点！"
  AyaTanukiOutro3Aya: "哦，抱歉。我只是觉得你做的很可爱。"
  AyaTanukiOutro4AyaTanuki: "可...可爱？"
  AyaTanukiOutro5Aya: "你为什么会在这里？你不是魔理沙小姐的部下吗？"
  AyaTanukiOutro6AyaTanuki: "我还有很多要学，所以从未接受过她的命令。"
  AyaTanukiOutro7AyaTanuki: "在竹林里练习伪装技巧时，我看到文文的弹幕飞走了。"
  AyaTanukiOutro8Aya: "她看起来很可疑，但魔理沙小姐不可能派一个新手狸猫来处理事件。"
  AyaTanukiOutro9AyaTanuki: "我只是想给文文一个惊喜，但一开口就被你攻击了。"
  AyaTanukiOutro10Aya: "哦，呃，再次抱歉。"
  AyaTanukiOutro11AyaTanuki: "如果你想道歉，就让我跟着你吧。"
  AyaTanukiOutro12Aya: "什么？我为什么要..."
  AyaTanukiOutro13Aya: "好吧，好吧。别掉队了。"
  AyaTanukiOutro14AyaTanuki: "耶~！从文文身上能学到很多！"
