  AyaBossFlandreDemoMove11FlandrePleasure: "禁忌「ブルーベリートラップ」！"
  AyaBossFlandreDemoMove12Flandre: "ブルーベリー？ なんで？"
  AyaBossFlandreDemoMove13FlandrePleasure: "弾幕に理由なんて必要ないよ。大事なのは、なぜやらないのかってこと！"
  AyaBossFlandreDemoMove14FlandrePleasure: "クランベリートラップがあるなら、どこかにブルーベリートラップもあるはず！"
  AyaBossFlandreDemoMove15Flandre: "そもそもクランベリートラップなんて存在しないけど。"
  AyaBossFlandreDemoMove16FlandrePleasure: "えっ？ クランベリーで罠を作ろうって考えた人はいないの？"
  AyaBossFlandreDemoMove17Flandre: "あったとしても、罠に仕掛けられる餌の一つでしかないよ。"
  AyaBossFlandreDemoMove18FlandrePleasure: "それじゃ面白くないよ。クランベリーが派手に爆発する罠がいい！"
  AyaBossFlandreDemoMove19Flandre: "クレイジーデイブにでも聞いて。"

  AyaBossFlandreDemoMove21FlandrePleasure: "ねえ、これ見て！"
  AyaBossFlandreDemoMove22Flandre: "それはレーヴァテインじゃない！いつの間に覚えたの？"
  AyaBossFlandreDemoMove23FlandrePleasure: "あなたが寝ている間に、出てきて新しい魔法を練習したんだよ。"
  AyaBossFlandreDemoMove24Flandre: "え？ 許可なしで出ていいなんて言ってないけど。"
  AyaBossFlandreDemoMove25FlandrePleasure: "もう、ちゃんと分身を活用しないと。"
  AyaBossFlandreDemoMove26FlandrePleasure: "必要な時だけ分身を使ってるけど、私たちにはもっと色々できるんだよ。"
  AyaBossFlandreDemoMove27Flandre: "あなたたちが私以上に騒ぎを起こしてなかったら、とっくにそうしてたよ。"
  AyaBossFlandreDemoMove28FlandrePleasure: "……それを言われると何も言えない！"

  AyaBossFlandreDemoMove31FlandrePleasure: "みんな出てきて！"
  AyaBossFlandreDemoMove32Flandre: "ちょっと！分身を呼び出せるのは私だけなのに！"
  AyaBossFlandreDemoMove33FlandreAnger: "寝てたんだけど！ったく！"
  AyaBossFlandreDemoMove34FlandrePleasure: "あ、ごめん！"
  AyaBossFlandreDemoMove35FlandreSorrow: "本を読んでいたんだけど……でも、手伝いが必要なら。"
  AyaBossFlandreDemoMove36Flandre: "私の心の世界に本があった記憶なんてないんだけど？"
  AyaBossFlandreDemoMove37FlandreSorrow: "現実世界の本を覚えて、心の世界に再現したの。"
  AyaBossFlandreDemoMove38Flandre: "それは普通にすごいね。"
  AyaBossFlandreDemoMove39FlandrePleasure: "よーし、みんな！やろう！"
  AyaBossFlandreDemoMove310FlandreSorrow: "仕方ないね。"
  AyaBossFlandreDemoMove311FlandreAnger: "痛い目を見るよ、オリジナル！"
  AyaBossFlandreDemoMove312Flandre: "待って――"
  AyaBossFlandreDemoMove313Flandre: "……私、あなたたちに何か悪いことした？"
  AyaBossFlandreDemoMove314FlandrePleasure: "ううん！"
  AyaBossFlandreDemoMove315FlandreSorrow: "えっと……たぶん違うと思う。"
  AyaBossFlandreDemoMove316FlandreAnger: "いや、少なくとも今はね。"

  AyaBossFlandreDemoMove41Flandre: "入ってよし、通ってよし。"
  AyaBossFlandreDemoMove42FlandrePleasure: "これは誰の細い道？"
  AyaBossFlandreDemoMove43Flandre: "これは天神様の細道だよ。"
  AyaBossFlandreDemoMove44FlandrePleasure: "どうか通らせてください。"

  AyaBossFlandreDemoMove4Normal5Flandre: "……"
  AyaBossFlandreDemoMove4Hidden6Flandre: "正当な理由なき者は通すわけにはいかない。"
  AyaBossFlandreDemoMove4Hidden7FlandrePleasure: "この子の七歳の誕生日を祝うため、"
  AyaBossFlandreDemoMove4Hidden8FlandrePleasure: "ここに御札を奉納しに来ました。"
  AyaBossFlandreDemoMove4HiddenFailure9Flandre: "……"
  AyaBossFlandreDemoMove4HiddenSuccess10Flandre: "入るのは簡単だけど、戻るのは怖いね。"
  AyaBossFlandreDemoMove4HiddenSuccess11Flandre: "怖いけど……"
  AyaBossFlandreDemoMove4HiddenSuccess12Flandre: "入ってよし、通ってよし。"

  AyaBossFlandreDemoMove51FlandrePleasure: "愛の迷路？もっと大きく考えようよ。"
  AyaBossFlandreDemoMove52FlandrePleasure: "愛の迷宮っていうのはどう？"
  AyaBossFlandreDemoMove53Flandre: "迷宮で愛を見つけられるとは思えないけど。"
  AyaBossFlandreDemoMove54FlandrePleasure: "迷路で愛を見つけられるみたいに言うね。"
  AyaBossFlandreDemoMove55Flandre: "それを言われると反論できない。"

  AyaBossFlandreDemoLastWord1FlandrePleasure: "ねえ、ちょっとやりすぎじゃない？"
  AyaBossFlandreDemoLose1FlandrePleasure: "私の勝ち！"
  AyaBossFlandreDemoLose2Flandre: "バカ、負けたんだよ！"
  AyaBossFlandreDemoLose3FlandrePleasure: "あ、そうか。あなたが負けたら私も負けなんだ。"
  AyaBossFlandreDemoWin1FlandrePleasure: "降参するよ！"
