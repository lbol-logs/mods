  - 深奥なる弾幕結界 ―夢幻・泡影・幻影―
  AyaBossYukariIntro1Yukari: "よろしいわ。私がお相手しましょう。"
  AyaBossYukariIntro2Yukari: "私は本当に弱いから、ウルトラマリンオーブエリクサーの力は一時的に封じておいたわ。"
  AyaBossYukariIntro3Yukari: "どうかお手柔らかにね～"
  AyaBossYukariIntro31Aya: "紫さんだから手加減するべきか、それとも本当に危険な相手だから全力で行くべきか……"
  AyaBossYukariIntro32Flandre: "この戦いではレベルリスタートもメインメニューも使えないの？面倒くさいなぁ。"
  AyaBossYukariNightmare11Yukari: "私の膝の上で、ゆっくり眠りなさい。"
  AyaBossYukariNightmare121Aya: "あやや……私があなたと同じくらい長生きなのを忘れましたか……"
  AyaBossYukariNightmare122Flandre: "え？誰が妖怪ババアの膝で寝たいと思うの……"
  AyaBossYukariNightmare21Yukari: "夢の中では、争いではなく安らぎがありますように。"
  AyaBossYukariNightmare221Aya: "でも平和じゃ記事にならないんですよ……！"
  AyaBossYukariNightmare222Flandre: "いや、それが一番の悪夢なんだけど……！"
  AyaBossYukariRanYakumo1Yukari: "藍、手を貸してくれる？"
  AyaBossYukariRanYakumo2Ran: "もちろんです、紫様。何をお望みですか？"
  AyaBossYukariRanYakumo3Yukari: "もう、からかっているの？私が{0}と弾幕ごっこをしているのが見えない？"
  AyaBossYukariRanYakumo4Yukari: "我らの異変解決者が、二人を同時に相手できるか見てみましょう。"
  AyaBossYukariRanYakumo5Ran: "仰せのままに。"
  AyaBossYukariRanYakumo6Ran: "さあ、{0}。あなたの力を見せてもらいましょう！"
  AyaBossYukariRanYakumo71Aya: "藍さん、探していました！お忙しいので取材する機会がなかなかなくて！"
  AyaBossYukariRanYakumo72Flandre: "きつねうどんを食べてみたかったんだよね。だから今、試してみる！"
  AyaBossYukariRanYakumo81Ran: "……なぜ驚かないのかしら。"
  AyaBossYukariRanYakumo82Ran: "きつねうどんは狐で作られているわけではありません……"
  AyaBossYukariBoundaryofHumans1Everyone: "！"
  AyaBossYukariBoundaryofHumans21Aya: "あややや！？ここはどこ！？"
  AyaBossYukariBoundaryofHumans22Flandre: "景色が急に変わった！"
  AyaBossYukariBoundaryofHumans3Yukari: "ふむ、転移……？ いいえ、この世界の現実を掴めないわ。"
  AyaBossYukariBoundaryofHumans41Aya: "ここは……外の世界？最後に見たのはずいぶん昔ですね。"
  AyaBossYukariBoundaryofHumans421Flandre: "外の世界？私は隠岐奈と一緒に何度か行ったことがあるよ。"
  AyaBossYukariBoundaryofHumans422SukusukuAya: "すくっ！\n（詳しく知りたい人は、フランドールのストーリーモードをお楽しみに！）"
  AyaBossYukariBoundaryofHumans5Yukari: "見えているものは確かに外の世界。でも、実際にそこにいるわけではないわ。"
  AyaBossYukariBoundaryofHumans61Aya: "それに紫さん、姿も変わっていますよね。何があったんですか？"
  AyaBossYukariBoundaryofHumans62Flandre: "それに服も変えたの？"
  AyaBossYukariBoundaryofHumans7Yukari: "私の姿……なるほど。これは誰かの記憶ね。"
  AyaBossYukariBoundaryofHumans81Aya: "記憶？それじゃあ今の紫さんの姿は、その記憶の持ち主の姿ということですか？"
  AyaBossYukariBoundaryofHumans82Flandre: "どうして人間の脳を覗き込んでいるのかは分からないけど。"
  AyaBossYukariBoundaryofHumans9Yukari: "この記憶が必ずしもその人間のものだとは断言できないわ。今の私に似た人間が、その記憶の中に登場しているだけかもしれない。"
  AyaBossYukariBoundaryofHumans101Aya: "誰か別の人……それでも、突然こんなことが起きた理由はあるはずです。"
  AyaBossYukariBoundaryofHumans102Flandre: "どちらにしても、どうしてこんなものが見えているのか分かる？"
  AyaBossYukariBoundaryofHumans11Yukari: "藍、解析を。"
  AyaBossYukariBoundaryofHumans12Ran: "この記憶は、紫様が外の世界を訪れた際に、隙間を通って入り込んだものと思われます。"
  AyaBossYukariBoundaryofHumans13Ran: "もしこの記憶が紫様の力に反応したのであれば、記憶の持ち主も似たような力を持っている可能性があります。"
  AyaBossYukariBoundaryofHumans14Yukari: "興味深いわ。その人間とは、いつか会ってみたいものね。"
  AyaBossYukariBoundaryofHumans15Yukari: "でも今は、目の前の戦いに集中しましょう。"
  AyaBossYukariBoundaryofHumans161Aya: "（あの人間、紫さんによく似ている……ただの偶然なのか、それとも……？）"
  AyaBossYukariBoundaryofHumans162Flandre: "（紫がメリーのことを何も知らないのか、それとも知らないふりをしているのか……）"
  AyaBossYukariMagicalGirlFlandreEngage1Okina: "ねえ紫。私のフランドールについて、どう思う？"
  AyaBossYukariMagicalGirlFlandreEngage2Yukari: "本当に素晴らしく成長したわね。あなたの計画が順調に進んでいるのが分かるわ。"
  AyaBossYukariMagicalGirlFlandreEngage3Okina: "当然よ！油の異変の頃から、フランドールには可能性があると分かっていたもの。"
  AyaBossYukariMagicalGirlFlandreEngage4Okina: "フランドール。紫と戦うことは、これまで出会ったどんな敵ともまったく違う経験になるでしょう。"
  AyaBossYukariMagicalGirlFlandreEngage5Okina: "勝っても負けても、全力を尽くしなさい！"
  AyaBossYukariLastWord1Yukari: "あらまあ、ずいぶん本気になったようね。"
  AyaBossYukariLastWord2Yukari: "それなら私も、全力を出さないといけないかしら～"
  AyaBossYukariLose1Yukari: "私の結界を0回しか破れなかったのね。まだまだ修行が必要ね。"
  AyaBossYukariLose2Yukari: "私の結界を1回破ったのね。異変解決者としては予想通り、といったところかしら。"
  AyaBossYukariLose3Yukari: "私の結界を2回破ったのね。見事だったわ。でも、あなたならもっとできるはずよ。"
  AyaBossYukariLose4Yukari: "私の結界を3回破ったのね。次は私を倒せるかもしれないわ。"
  AyaBossYukariLose5Yukari: "あなたを家に帰すこともできるし、この冒険を続けることもできるわ。"

