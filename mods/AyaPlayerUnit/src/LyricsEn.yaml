  Line8A: "Listen closely to her gentle humming"
  Line9: "ララ　ラララン　ラララン"
  Line9A: "La la lalala lalala"
  Line10: "声がして"
  Line10A: "A voice calls out"
  Line11: "その後は悲鳴だけ響く"
  Line11A: "And then, only screams echo"

  Line12: "おままごと　しましょう"
  Line12A: "Let’s play house together"
  Line13: "遊びのお相手は"
  Line13A: "Her playmate is"
  Line14: "可愛らしいお人形"
