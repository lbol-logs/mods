  Line38A: "​​​The weaknesses are flowing water"
  Line39: "熱く輝いてる太陽"
  Line39A: "and the scorching sun"

  Line40: "ああ弱いとこだって魅力で"
  Line40A: "​​​Ahh, even weaknesses have become charms"
  Line41: "それぞれの解釈で広がった"
  Line41A: "and spread with different interpretations"
  Line42: "あなたの幻想郷"
  Line42A: "​​​Your Gensokyo"
  Line43: "そこに居るあなたのフランドール"
  Line43A: "In that place, your Flandre is there"

  Line44: "天使の笑顔のヴァンパイア"
  Line44A: "​​​The vampire with an angelic smile"
  Line45: "コンティニューできないのここは"
  Line45A: "You can't use a continue here"
  Line46: "レーヴァテインは神話のレプリカ"
  Line46A: "​​​Laevateinn is a replica of mythology"
  Line47: "迷路の出口こそが愛だ"
  Line47A: "The exit of maze is merely love it self"
  Line48: "紅い霧で隠すレミリア"
  Line48A: "​​​Shrouded in red mist is Remilia"
  Line49: "完璧にこなすのは咲夜"
  Line49A: "Sakuya is the one who executes perfectly"
  Line50: "七色の羽根の私がイデア"
  Line50A: "​​​I have seven-colored wings, look at me, I'm Idea"
  Line51: "弾幕はとびきりの愛だ"
  Line51A: "Danmaku is the greatest kind of love"

  Line52: "これまで愛されたことも"
  Line52A: "​​​I've believed no one that has loved me whole"
  Line53: "愛せたこともないと思ってた"
  Line53A: "and I've not been in love with anybody before"
  Line54: "そんな私があなたの推しになれたのは"
  Line54A: "​​​Despite being like that, I become your fave"
  Line55: "本当だから"
  Line55A: "That's the truth"
  Line56: "ありがとう"
  Line56A: "Thank you"

  Line57: "これからもきっと狂わせていく"
  Line57A: "I wanna keep driving you crazy in the future too"
  Line58: "私欲張りフランドール"
  Line58A: "​​​I'm greedy, true voracious Flandre"
  Line59: "この居場所でみんなのこと"
  Line59A: "In this place, what I'm wishing for is"
  Line60: "愛し壊し続けたいから"
  Line60A: "​​​to love and break each of you with all my heart"

  Line61: "ああ今日もスペルで勝負"
  Line61A: "Ahh, today I have spell card battles again"
  Line62: "未熟だけれど世界も救ったよ"
  Line62A: "​​​Although I was naive, I saved the world"
  Line63: "それでもまだ届かなくて"
  Line63A: "​​​Up to this day, still, I've not been able to reach you"
  Line64: "伝えられずにいたけど"
  Line64A: "and let you hear me saying"

  Line65: "今ならもう言えるかも"
  Line65A: "I might be able to say it now"
  Line66: "これからもずっと愛してる"
  Line66A: "Always and forever ​​​I love you"
