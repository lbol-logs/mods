  Line16A: "The room's gotten messy"
  Line17: "赤い綿散らして"
  Line17A: "Red stuffing scattered everywhere"
  Line18: "糸で縫い直せば"
  Line18A: "If I sew it back with thread"
  Line19: "まだ遊べるかな？"
  Line19A: "Can we still play again?"
  Line20: "継き接きのお人形"
  Line20A: "A patchwork doll"
  Line21: "次は何しましょう"
  Line21A: "What shall we do next?"
  Line22: "可愛い声で鳴く"
  Line22A: "It cries in a sweet little voice"
  Line23: "私のおもちゃ"
  Line23A: "My precious toy"

  Line24: "とあるお屋敷の　そのまた奥に"
  Line24A: "Deep within a certain mansion"
  Line25: "誰も知らない　秘密の花園"
  Line25A: "Lies a secret garden no one knows about"
  Line26: "並ぶ人形は"
  Line26A: "The dolls lined up in rows"
  Line27: "皆傷だらけ"
  Line27A: "Are all covered in wounds"
  Line28: "それを眺める"
  Line28A: "She gazes at them"
  Line29: "恍惚の少女"
  Line29A: "A girl in ecstasy"

  Line30: "入り込めば二度とは戻れない"
  Line30A: "Once you step inside, there's no return"
  Line31: "茨に囲まれた 乙女の城"
  Line31A: "A maiden’s castle, surrounded by thorns"
  Line32: "ララ　ラララン　ラララン"
  Line32A: "La la lalala lalala"
  Line33: "振り向けば"
  Line33A: "Turn around"
  Line34: "無邪気さと狂気の笑みが浮かぶ"
  Line34A: "And a smile of innocence and madness appears"

  Line35: "ご挨拶しましょう"
  Line35A: "Let’s greet each other"
  Line36: "まずは握手かしら"
  Line36A: "Shall we start with a handshake?"
  Line37: "新しいお人形"
  Line37A: "A brand-new doll"
  Line38: "傷だらけになれば"
  Line38A: "If it gets all torn up"
  Line39: "直してあげるわ"
  Line39A: "I’ll fix it for you"
