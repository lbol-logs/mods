  Line40A: "With skin-colored felt"
  Line41: "どうして何もかも　私が触れたら"
  Line41A: "Why is it that whenever I touch something"
  Line42: "勝手に壊れちゃう"
  Line42A: "It breaks on its own?"
  Line43: "もっと頑丈な　玩具が欲しいのよ"
  Line43A: 'I want a sturdier toy'
  Line44: "探してきてね"
  Line44A: "Go find one for me"

  Line45: "おままごと　しましょう"
  Line45A: "Let’s play house together"
  Line46: "遊びのお相手は"
  Line46A: "Her playmate is"
  Line47: "可愛らしいお人形"
  Line47A: "A lovely little doll"
  Line48: "頭が取れちゃった"
  Line48A: "Its head has come off"
  Line49: "お掃除しなくちゃ"
  Line49A: "I’ve got to clean up"
  Line50: "真っ赤に染まる部屋"
  Line50A: "The room is dyed bright red"
  Line51: "私悪くないわ"
  Line51A: "It’s not my fault"
  Line52: "すぐに壊れちゃう"
  Line52A: "They always break so easily"
  Line53: "人形がいけないの！"
  Line53A: "It’s the doll’s fault!"
  Line54: "怯える瞳が"
  Line54A: "Those trembling eyes"
  Line55: "愛しく思えるの"
  Line55A: "Look so adorable"
  Line56: "声を聞かせて"
  Line56A: "Let me hear your voice"
