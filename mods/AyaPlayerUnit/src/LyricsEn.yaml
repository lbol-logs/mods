  Line7A: "lived alone underground ticking away the past?"
  Line8: "ああ好きな血液型はわからない？"
  Line8A: "​​​Ah, no one knows her preferred blood type?"
  Line9: "ミステリアスなシスターヴァンプ"
  Line9A: "Mysterious Sister Vamp"

  Line10: "常に飄々と　だけど爛漫で"
