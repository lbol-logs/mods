  Line35: "鏡に映らない自分のこと許せない"
  Line35A: "​​​Can't forgive myself not being reflected in the mirror"

  Line36: "誰もが一度は好きになる"
  Line36A: "​​​That emotion makes all hearts fall in love at least once"
  Line37: "真紅の妹フランドール"
  Line37A: "She's the scarlet younger sister Flandre"
