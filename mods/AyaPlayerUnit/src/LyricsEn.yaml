  Line17: "そんな言葉に また抱え落ちる"
  Line17A: "​​​Once again, there's somebody who's fallen for the words"
  Line18: "また推しにさせる"
  Line18A: "​​​Made him lose his head over her"

  Line19: "誰もが一度は好きになる"
  Line19A: "That emotion makes all hearts fall in love at least once"
  Line20: "最強妹フランドール"
  Line20A: "​​​​​​She's the strongest younger sister Flandre"
  Line21: "他の作品トコじゃ味わえない"
  Line21A: "​​​She can't be experienced in other works"
  Line22: "神が生み落とした伝説"
  Line22A: "She's the legend created by the god"

  Line23: "ああそのスリルな弾幕"
  Line23A: "Ah, that thrilling danmaku"
  Line24: "誰も彼もが虜になってゆく"
  Line24A: "​​​Now, everybody becomes lured and captivated by you"
  Line25: "紅い瞳もセリフも"
