FlandreSongBrokenDollMarch:
  Line1: "暗い部屋の中彼女は独り"
  Line1A: "昏暗的房间里，她独自一人"
  Line2: "おもちゃに囲まれ　人形遊び"
  Line2A: "被玩具包围着　玩着洋娃娃"
  Line3: "服を着せ替えて"
  Line3A: "给她换衣服"
  Line4: "散らして 投げて"
  Line4A: "弄得乱七八糟　随手一扔"
  Line5: "バラバラにして"
  Line5A: "拆得七零八落"
  Line6: "中を見てみましょう"
  Line6A: "让我们看看里面吧"

  Line7: "この笑みの中に悪魔は宿る"
  Line7A: "在这笑容里，恶魔正潜伏着"
  Line8: "鼻歌のしらべに耳を澄ませ"
  Line8A: "侧耳倾听哼唱的旋律"
  Line9: "ララ　ラララン　ラララン"
  Line9A: "啦啦　啦啦啦　啦啦啦"
  Line10: "声がして"
  Line10A: "传来声音"
  Line11: "その後は悲鳴だけ響く"
  Line11A: "之后只剩下悲鸣回荡"

  Line12: "おままごと　しましょう"
  Line12A: "来玩过家家吧"
  Line13: "遊びのお相手は"
  Line13A: "玩伴是"
  Line14: "可愛らしいお人形"
  Line14A: "可爱的玩偶"
  Line15: "腕が千切れちゃった"
  Line15A: "胳膊断掉了"
  Line16: "部屋が汚れちゃう"
  Line16A: "房间弄脏了"
  Line17: "赤い綿散らして"
  Line17A: "红色的棉絮散落一地"
  Line18: "糸で縫い直せば"
  Line18A: "用线缝补好"
  Line19: "まだ遊べるかな？"
  Line19A: "还能继续玩吗？"
  Line20: "継き接きのお人形"
  Line20A: "东拼西凑的玩偶"
  Line21: "次は何しましょう"
  Line21A: "接下来做什么好呢"
  Line22: "可愛い声で鳴く"
  Line22A: "发出可爱声音的"
  Line23: "私のおもちゃ"
  Line23A: "我的玩具"

  Line24: "とあるお屋敷の　そのまた奥に"
  Line24A: "某座宅邸的　最深处"
  Line25: "誰も知らない　秘密の花園"
  Line25A: "无人知晓的　秘密花园"
  Line26: "並ぶ人形は"
  Line26A: "排成一列的人偶"
  Line27: "皆傷だらけ"
  Line27A: "个个伤痕累累"
  Line28: "それを眺める"
  Line28A: "凝视着它们的"
  Line29: "恍惚の少女"
  Line29A: "少女神情恍惚"

  Line30: "入り込めば二度とは戻れない"
  Line30A: "一旦踏入便再也无法回头"
  Line31: "茨に囲まれた 乙女の城"
  Line31A: "被荆棘环绕的　少女之城"
  Line32: "ララ　ラララン　ラララン"
  Line32A: "拉拉　拉拉兰　拉拉兰"
  Line33: "振り向けば"
  Line33A: "回过头去"
  Line34: "無邪気さと狂気の笑みが浮かぶ"
  Line34A: "天真与疯狂的笑容浮现"

  Line35: "ご挨拶しましょう"
  Line35A: "来打个招呼吧"
  Line36: "まずは握手かしら"
  Line36A: "先握手好吗"
  Line37: "新しいお人形"
  Line37A: "新的人偶"
  Line38: "傷だらけになれば"
  Line38A: "如果伤痕累累"
  Line39: "直してあげるわ"
  Line39A: "我会帮你修好的"
  Line40: "肌色のフェルトで"
  Line40A: "用肉色的毛毡"
  Line41: "どうして何もかも　私が触れたら"
  Line41A: "为什么只要我一碰"
  Line42: "勝手に壊れちゃう"
  Line42A: "一切都会自行破碎"
  Line43: "もっと頑丈な　玩具が欲しいのよ"
  Line43A: "我想要更结实的玩具"
  Line44: "探してきてね"
  Line44A: "去帮我找来吧"

  Line45: "おままごと　しましょう"
  Line45A: "我们来过家家吧"
  Line46: "遊びのお相手は"
  Line46A: "玩伴是"
  Line47: "可愛らしいお人形"
  Line47A: "那可爱的玩偶"
  Line48: "頭が取れちゃった"
  Line48A: "头掉下来了"
  Line49: "お掃除しなくちゃ"
  Line49A: "得去打扫一下"
  Line50: "真っ赤に染まる部屋"
  Line50A: "染成鲜红色的房间"
  Line51: "私悪くないわ"
  Line51A: "不是我的错"
  Line52: "すぐに壊れちゃう"
  Line52A: "转眼就坏了"
  Line53: "人形がいけないの！"
  Line53A: "是玩偶的问题！"
  Line54: "怯える瞳が"
  Line54A: "那双惊恐的眼睛"
  Line55: "愛しく思えるの"
  Line55A: "让我觉得好可爱"
  Line56: "声を聞かせて"
  Line56A: "让我听听你的声音"
