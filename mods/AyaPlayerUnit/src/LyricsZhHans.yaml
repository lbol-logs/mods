  Line16: "過激派なヴァンパイア　嫌、嫌！"
  Line16A: "激进派的吸血鬼　讨厌，讨厌！"

  Line17: "あの頃のあなたは全てを破壊するよな目してたのに"
  Line17A: "那时的你明明眼神里充满了要摧毁一切的杀气"
  Line18: "どうして　なんでなんでなんでそんなの"
  Line18A: "为什么　为什么为什么为什么会变成那样"
  Line19: "解釈違い　デッドライン"
