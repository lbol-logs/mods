#For translators: Don't translate original lyrics.
FlandreSongFlandol:
  Line1: "完全無欠のヴァンパイア"
  Line1A: "无懈可击的吸血鬼"
  Line2: "破壊するその手でブレイクアウト"
  Line2A: "用那双毁灭之手破笼而出"
  Line3: "彼女の人生浴びたらクリア"
  Line3A: "沐浴在她的人生中便能通关"
  Line4: "強さで心奪う君は"
  Line4A: "以力量俘获人心的你"
  Line5: "悪魔的な妹様"
  Line5A: "是恶魔般的妹妹大人"

  Line6: "ああ何年地下に閉じこもって"
  Line6A: "啊，在地下闭关了多少年"
  Line7: "独り過去を刻んでいたの？"
  Line7A: "独自铭刻着过去？"
  Line8: "ああ好きな血液型はわからない？"
  Line8A: "啊，不知道喜欢的血型吗？"
  Line9: "ミステリアスなシスターヴァンプ"
  Line9A: "神秘的吸血鬼修女"

  Line10: "常に飄々と　だけど爛漫で"
  Line10A: "总是飘逸洒脱　却又烂漫"
  Line11: "禁忌は甘い果実味"
  Line11A: "禁忌是甜美的果实滋味"
  Line12: "ああボムもないないない"
  Line12A: "啊，没有炸弹没有没有"
  Line13: "残機ないないない"
  Line13A: "没有残机没有没有"
  Line14: "1位になった感想は？"
  Line14A: "获得第一名的感想是？"

  Line15: "「誰かの<好き>になれるなんてよく分からなくて」"
  Line15A: "“我完全不懂怎么会成为某人的‘喜欢’”"
  Line16: "興味があるかわからない"
  Line16A: "不知道有没有兴趣"
  Line17: "そんな言葉に また抱え落ちる"
  Line17A: "面对这样的话语　又被深深吸引"
  Line18: "また推しにさせる"
  Line18A: "又让我忍不住去推她"

  Line19: "誰もが一度は好きになる"
  Line19A: "谁都会爱上一次"
  Line20: "最強妹フランドール"
  Line20A: "最强妹妹弗兰多尔"
  Line21: "他の作品トコじゃ味わえない"
  Line21A: "在其他作品中无法体验"
  Line22: "神が生み落とした伝説"
  Line22A: "神所创造的传说"

  Line23: "ああそのスリルな弾幕"
  Line23A: "啊　那刺激的弹幕"
  Line24: "誰も彼もが虜になってゆく"
  Line24A: "让所有人纷纷沦陷"
  Line25: "紅い瞳もセリフも"
  Line25A: "红色的瞳孔与台词"
  Line26: "織り成すその全て"
  Line26A: "交织而成的这一切"
  Line27: "フランドール"
  Line27A: "弗兰多尔"

  Line28: "はいはい私は悪い子です"
  Line28A: "是是，我是个坏孩子"
  Line29: "だから幽閉されてるんです"
  Line29A: "所以才被囚禁在这里"
  Line30: "お姉様のおまけの妹です"
  Line30A: "我是姐姐的附赠品般的妹妹"
  Line31: "全て言いなりで終わらせたくない"
  Line31A: "不想就这样全盘听命于人"
  Line32: "ここの部屋の鍵壊せない訳ない"
  Line32A: "这间房子的钥匙我怎么可能弄不坏"
  Line33: "だけど壊さないだって上手く使えない"
  Line33A: "可是不弄坏的话又用不上"
  Line34: "籠の鳥の私なんて許せはしない"
  Line34A: "绝不会原谅被囚禁在笼中的自己"
  Line35: "鏡に映らない自分のこと許せない"
  Line35A: "无法原谅镜中映不出自己的模样"

  Line36: "誰もが一度は好きになる"
  Line36A: "每个人都会爱上一次"
  Line37: "真紅の妹フランドール"
  Line37A: "深红的妹妹弗兰多尔"
  Line38: "弱点は流れる水と"
  Line38A: "弱点是流动的水"
  Line39: "熱く輝いてる太陽"
  Line39A: "以及炽热闪耀的太阳"

  Line40: "ああ弱いとこだって魅力で"
  Line40A: "啊，就连软肋也是魅力"
  Line41: "それぞれの解釈で広がった"
  Line41A: "因各自的解读而延伸"
  Line42: "あなたの幻想郷"
  Line42A: "属于你的幻想乡"
  Line43: "そこに居るあなたのフランドール"
  Line43A: "在那里的你的弗兰多尔"

  Line44: "天使の笑顔のヴァンパイア"
  Line44A: "拥有天使般笑容的吸血鬼"
  Line45: "コンティニューできないのここは"
  Line45A: "这里无法继续"
  Line46: "レーヴァテインは神話のレプリカ"
  Line46A: "莱瓦汀是神话的复制品"
  Line47: "迷路の出口こそが愛だ"
  Line47A: "迷宫的出口才是爱"
  Line48: "紅い霧で隠すレミリア"
  Line48A: "被红色雾气掩藏的雷米莉亚"
  Line49: "完璧にこなすのは咲夜"
  Line49A: "完美应对的是咲夜"
  Line50: "七色の羽根の私がイデア"
  Line50A: "拥有七彩羽翼的我才是理想"
  Line51: "弾幕はとびきりの愛だ"
  Line51A: "弹幕是无与伦比的爱"

  Line52: "これまで愛されたことも"
  Line52A: "一直以为自己从未被爱过"
  Line53: "愛せたこともないと思ってた"
  Line53A: "也从未爱过谁"
  Line54: "そんな私があなたの推しになれたのは"
  Line54A: "这样的我却能成为你的推"
  Line55: "本当だから"
  Line55A: "正因为这是真的"
  Line56: "ありがとう"
  Line56A: "谢谢你"

  Line57: "これからもきっと狂わせていく"
  Line57A: "今后也一定会让你为之疯狂"
  Line58: "私欲張りフランドール"
  Line58A: "贪心的弗兰多尔"
  Line59: "この居場所でみんなのこと"
  Line59A: "在这个归属之地"
  Line60: "愛し壊し続けたいから"
  Line60A: "我想继续爱着大家直到破碎"

  Line61: "ああ今日もスペルで勝負"
  Line61A: "啊 今天也要用咒文决胜负"
  Line62: "未熟だけれど世界も救ったよ"
  Line62A: "虽然还很青涩 但我已经拯救了世界"
  Line63: "それでもまだ届かなくて"
  Line63A: "即便如此 依然无法触及"
  Line64: "伝えられずにいたけど"
  Line64A: "虽然一直无法传达"

  Line65: "今ならもう言えるかも"
  Line65A: "但现在或许能说出口了"
  Line66: "これからもずっと愛してる"
  Line66A: "今后也会一直爱着你"
FlandreSongRadicalVampire:
  Line1: "あなたのその力　私にぶつけて"
  Line1A: "把你的力量　全都倾泻在我身上"
  Line2: "ぐちゃぐちゃになるまで　私に試して"
  Line2A: "直到支离破碎　尽情在我身上试一试"

  Line3: "水は苦手だけど　特訓するから"
  Line3A: "虽然我不擅长水系　但我会特训的"
  Line4: "ドロドロになっても　私にやらせて？"
  Line4A: "哪怕变得泥泞不堪　也让我来试试？"

  Line5: "破壊破壊で無問題　過激過激な吸血鬼"
  Line5A: "破坏破坏没问题　激进激进的吸血鬼"
  Line6: "情緒不安定に剪定　破滅破滅支離滅裂"
  Line6A: "剪除情绪不稳　毁灭毁灭支离破碎　"
  Line7: "殲滅せよ！"
  Line7A: "歼灭吧！"

  Line8: "地獄の門番だなんて"
  Line8A: "什么地狱守门人"
  Line9: "私にとってはただのオモチャ"
  Line9A: "对我来说不过是个玩具"
  Line10: "三つ首番犬だって"
  Line10A: "哪怕是三头看门犬"
  Line11: "魂も刈り取ってって　Yeah-Yeah！"
  Line11A: "连灵魂都要收割——Yeah-Yeah！"

  Line12: "イージーな扉なんて"
  Line12A: "那种轻松的门"
  Line13: "開く意味はないの　ストイック"
