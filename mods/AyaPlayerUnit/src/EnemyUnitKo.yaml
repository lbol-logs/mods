  AyaTanukiAMOLED1AyaTanuki: "저는 상태이상을 막을거에요!"
  AyaTanukiAMOLED2AyaTanuki: "저 이거 너무 못하는거같아요."
  AyaTanukiExtremeTurn1AyaTanuki: "아야씨의 차례는 절대 오지 않을 거예요! 나와라 추가턴!"
  AyaTanukiExtremeTurn2AyaTanuki: "음, 왜 앞에 벽이 있죠"
  AyaTanukiExtremeTurn3AyaTanuki: "미야아아앜!!!"
  AyaTanukiExtremeTurn4AyaTanuki: "아무 일도 없었던 걸로 해주세요."
  AyaTanukiOpticalChameleon1AyaTanuki: "아야씨는 절대 제 방어전략을 뚫을 수 없을걸요?"
  AyaTanukiOpticalChameleon2AyaTanuki: "잠깐, 어디가? 돌아와요!"
  AyaTanukiOpticalChameleon3AyaTanuki: "...에?"
  AyaTanukiOpticalChameleon4AyaTanuki: "읏 윽 읏 윽 읏 윽"
